<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Планировщик — Битрикс24</title>
  <!-- BX24 JS SDK: авторизация и REST внутри портала Битрикс24 -->
  <script src="//api.bitrix24.com/api/v1/"></script>
  <style>
/* Планировщик для Битрикс24 — минималистичный Material-стиль. */

:root {
  --c-task-bg: #BBDEFB;   --c-task-br: #64B5F6;
  --c-event-bg: #C8E6C9;  --c-event-br: #81C784;
  --c-absence-bg: #E0E0E0;--c-absence-br: #BDBDBD;
  --c-primary: #2196F3;
  --c-text: #212121;      --c-muted: #757575;
  --c-line: #E0E0E0;      --c-line-strong: #BDBDBD;
  --c-bg: #FAFAFA;        --c-surface: #FFFFFF;
  --header-h: 56px;
  --day-head-h: 34px;
  --sub-head-h: 26px;
  --shadow: 0 2px 8px rgba(0,0,0,.12);
  --shadow-lg: 0 8px 28px rgba(0,0,0,.20);
}

* { box-sizing: border-box; }

html, body {
  margin: 0; height: 100%;
  font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color: var(--c-text); background: var(--c-bg);
  font-size: 14px;
}

/* --- Шапка --------------------------------------------------------------- */

.app-header {
  position: relative;
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; height: var(--header-h);
  padding: 0 16px;
  background: var(--c-surface);
  border-bottom: 1px solid var(--c-line);
  box-shadow: 0 1px 3px rgba(0,0,0,.08);
  z-index: 20;
}
.app-header__left, .app-header__right { display: flex; align-items: center; gap: 14px; }
.app-header__title { font-weight: 600; font-size: 16px; white-space: nowrap; }
.app-header__nav { display: flex; align-items: center; gap: 6px; }
.app-header__week { font-weight: 500; color: var(--c-muted); margin-left: 8px; white-space: nowrap; }

.nav-btn {
  border: 1px solid var(--c-line); background: var(--c-surface);
  border-radius: 8px; cursor: pointer; font-size: 18px; line-height: 1;
  width: 32px; height: 32px; color: var(--c-text);
  display: inline-flex; align-items: center; justify-content: center;
  transition: background .15s;
}
.nav-btn--text { width: auto; padding: 0 12px; font-size: 13px; }
.nav-btn:hover { background: #F0F0F0; }

.icon-btn {
  border: 1px solid var(--c-line); background: var(--c-surface);
  border-radius: 8px; cursor: pointer; font-size: 18px;
  width: 36px; height: 36px;
  display: inline-flex; align-items: center; justify-content: center;
  transition: background .15s;
}
.icon-btn:hover { background: #F0F0F0; }

.app-header__progress {
  position: absolute; left: 0; bottom: -1px; height: 3px; width: 0;
  background: var(--c-primary); transition: width .3s ease;
}
body.is-loading .app-header__progress {
  width: 100%;
  animation: progress 1.2s ease-in-out infinite;
}
@keyframes progress {
  0% { width: 0; opacity: 1; } 50% { width: 70%; } 100% { width: 100%; opacity: .3; }
}

/* --- Мультиселект сотрудников ------------------------------------------- */

.emp-picker { position: relative; }
.emp-picker__button {
  display: inline-flex; align-items: center; gap: 8px;
  max-width: 360px; height: 36px; padding: 0 12px;
  border: 1px solid var(--c-line); border-radius: 8px;
  background: var(--c-surface); cursor: pointer; font-size: 13px;
}
.emp-picker__label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.emp-picker__caret { color: var(--c-muted); }
.emp-picker__panel {
  position: absolute; right: 0; top: calc(100% + 6px);
  width: 320px; background: var(--c-surface);
  border: 1px solid var(--c-line); border-radius: 10px;
  box-shadow: var(--shadow-lg); z-index: 30; padding: 10px;
}

.emp-panel--embedded { margin-top: 10px; }
.emp-panel__search {
  width: 100%; height: 34px; padding: 0 10px; margin-bottom: 8px;
  border: 1px solid var(--c-line); border-radius: 8px; font-size: 13px;
}
.emp-panel__counter { font-size: 12px; color: var(--c-muted); margin-bottom: 6px; }
.emp-panel__list { max-height: 320px; overflow-y: auto; }
.emp-panel__empty { color: var(--c-muted); padding: 10px; text-align: center; }

.emp-row {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 6px; border-radius: 8px; cursor: pointer;
}
.emp-row:hover { background: #F5F5F5; }
.emp-row--disabled { opacity: .45; cursor: not-allowed; }
.emp-row input { width: 16px; height: 16px; }
.emp-row__name { font-size: 13px; }
.emp-row__pos { font-size: 11px; color: var(--c-muted); }

/* --- Календарь ----------------------------------------------------------- */

.calendar { height: calc(100vh - var(--header-h)); overflow: hidden; }
.cal-scroll-y { height: 100%; overflow: auto; }
.cal-grid { display: flex; width: max-content; min-width: 100%; }

.cal-empty {
  height: 100%; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 8px; color: var(--c-muted);
}
.cal-empty__icon { font-size: 48px; }
.cal-empty__text { font-size: 18px; font-weight: 500; color: var(--c-text); }
.cal-empty__hint { font-size: 13px; }

/* Временная шкала слева */
.cal-time {
  position: sticky; left: 0; z-index: 6;
  width: 64px; flex: 0 0 64px; background: var(--c-surface);
  border-right: 1px solid var(--c-line-strong);
}
.cal-time__header {
  height: calc(var(--day-head-h) + var(--sub-head-h));
  position: sticky; top: 0; z-index: 7; background: var(--c-surface);
  border-bottom: 1px solid var(--c-line-strong);
}
.cal-time__slot {
  position: relative; border-bottom: 1px dashed var(--c-line);
  font-size: 11px; color: var(--c-muted); text-align: right;
  padding-right: 6px;
}
.cal-time__slot--hour { color: var(--c-text); border-bottom: 1px solid var(--c-line-strong); }

/* Колонка дня */
.cal-day {
  flex: 1 0 auto; min-width: 180px;
  border-right: 1px solid var(--c-line-strong);
}
.cal-day--today { background: rgba(33,150,243,.03); }
.cal-day__header {
  position: sticky; top: 0; z-index: 5;
  height: var(--day-head-h); line-height: var(--day-head-h);
  text-align: center; font-weight: 600; font-size: 13px;
  background: var(--c-surface); border-bottom: 1px solid var(--c-line);
}
.cal-day--today .cal-day__header { color: var(--c-primary); }
.cal-day__sub {
  position: sticky; top: var(--day-head-h); z-index: 4;
  display: flex; height: var(--sub-head-h);
  background: var(--c-surface); border-bottom: 1px solid var(--c-line-strong);
}
.cal-day__sub-cell {
  flex: 1 1 0; min-width: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: var(--c-muted);
  border-left: 1px solid var(--c-line); overflow: hidden;
  white-space: nowrap; text-overflow: ellipsis; padding: 0 4px;
}
.cal-day__sub-cell:first-child { border-left: none; }

.cal-day__body { display: flex; }
.cal-subcol {
  position: relative; flex: 1 1 0; min-width: 0;
  border-left: 1px solid var(--c-line);
}
.cal-subcol:first-child { border-left: none; }

.cal-slot { border-bottom: 1px dashed var(--c-line); cursor: pointer; }
.cal-slot:nth-child(2n) { border-bottom: 1px solid var(--c-line); }
.cal-slot:hover { background: rgba(33,150,243,.06); }

/* Блок сущности */
.cal-block {
  position: absolute; z-index: 2;
  border: 1px solid; border-left-width: 3px; border-radius: 5px;
  padding: 3px 5px; overflow: hidden; cursor: pointer;
  box-shadow: 0 1px 2px rgba(0,0,0,.10); font-size: 12px;
}
.cal-block:hover { box-shadow: var(--shadow); z-index: 3; }
.cal-block--edge { opacity: .9; }
.cal-block__content { display: flex; flex-direction: column; gap: 2px; height: 100%; }
.cal-block__title {
  font-weight: 600; line-height: 1.15;
  overflow: hidden; text-overflow: ellipsis;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.cal-block__meta {
  display: flex; align-items: center; gap: 5px;
  font-size: 11px; color: #37474F; margin-top: auto;
}
.cal-block__hours { font-variant-numeric: tabular-nums; font-weight: 600; }
.cal-block__status { font-size: 12px; }
.cal-block__repeat { font-size: 11px; margin-left: auto; }

.cal-block__edit {
  position: absolute; top: 2px; right: 2px;
  width: 20px; height: 20px; border: none; border-radius: 5px;
  background: rgba(255,255,255,.85); cursor: pointer; font-size: 12px;
  display: none; align-items: center; justify-content: center;
}
.cal-block:hover .cal-block__edit { display: inline-flex; }
.cal-block__edit:hover { background: #fff; }

.cal-block__edge {
  position: absolute; left: 0; right: 0;
  font-size: 9px; text-align: center; color: #455A64;
  background: rgba(0,0,0,.10); line-height: 12px; height: 12px;
}
.cal-block__edge--top { top: 0; }
.cal-block__edge--bottom { bottom: 0; }

/* --- Тултип -------------------------------------------------------------- */

.tooltip {
  position: fixed; z-index: 1000; max-width: 320px;
  background: #263238; color: #fff; border-radius: 8px;
  padding: 10px 12px; font-size: 12px; line-height: 1.45;
  box-shadow: var(--shadow-lg); pointer-events: none;
  opacity: 0; visibility: hidden; transition: opacity .12s;
}
.tooltip--visible { opacity: 1; visibility: visible; }
.tooltip__title { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
.tooltip__row { margin-top: 2px; }
.tooltip__row b { color: #B0BEC5; font-weight: 500; }
.tooltip__desc { margin-top: 6px; color: #CFD8DC; border-top: 1px solid #37474F; padding-top: 6px; }

/* --- Модальные окна ------------------------------------------------------ */

.modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,.40);
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
.modal {
  width: 100%; background: var(--c-surface);
  border-radius: 12px; box-shadow: var(--shadow-lg);
  max-height: 90vh; overflow: hidden; display: flex; flex-direction: column;
}
.modal__head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; border-bottom: 1px solid var(--c-line);
}
.modal__title { font-weight: 600; font-size: 15px; }
.modal__close {
  border: none; background: none; cursor: pointer; font-size: 22px;
  line-height: 1; color: var(--c-muted);
}
.modal__close:hover { color: var(--c-text); }
.modal__body { padding: 16px; overflow-y: auto; }
.modal__footer {
  display: flex; justify-content: flex-end; gap: 8px;
  margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--c-line);
}

.btn {
  border: 1px solid transparent; border-radius: 8px; cursor: pointer;
  font-size: 13px; padding: 9px 16px; font-weight: 500;
}
.btn--primary { background: var(--c-primary); color: #fff; }
.btn--primary:hover { background: #1E88E5; }
.btn--primary:disabled { opacity: .6; cursor: default; }
.btn--ghost { background: var(--c-surface); border-color: var(--c-line); color: var(--c-text); }
.btn--ghost:hover { background: #F5F5F5; }
.btn--danger { background: var(--c-surface); border-color: #EF9A9A; color: #C62828; margin-right: auto; }
.btn--danger:hover { background: #FFEBEE; }
.btn--danger:disabled { opacity: .6; cursor: default; }

.form__row { display: block; margin-bottom: 12px; }
.form__label { display: block; font-size: 12px; color: var(--c-muted); margin-bottom: 4px; }
.form__input {
  width: 100%; height: 38px; padding: 0 10px;
  border: 1px solid var(--c-line); border-radius: 8px; font-size: 14px;
  font-family: inherit;
}
.form__textarea { height: auto; padding: 8px 10px; resize: vertical; }
.form__input:focus { outline: none; border-color: var(--c-primary); }
.form__meta {
  font-size: 13px; color: var(--c-muted);
  background: #F5F5F5; padding: 8px 10px; border-radius: 8px; margin-bottom: 12px;
}
.form__loading { padding: 20px; text-align: center; color: var(--c-muted); }

/* Повторение */
.recur [hidden] { display: none !important; }
.recur__details { margin-top: 8px; padding: 10px 12px; border: 1px dashed var(--c-line); border-radius: 8px; }
.recur__interval { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.recur__interval .form__label { width: 100%; }
.recur__interval .form__input { width: 90px; }
.recur__unit { font-size: 13px; color: var(--c-muted); }
.recur__days { display: flex; flex-wrap: wrap; gap: 6px; }
.recur__days .form__label { width: 100%; }
.recur__day {
  display: inline-flex; align-items: center; gap: 4px; cursor: pointer;
  border: 1px solid var(--c-line); border-radius: 16px; padding: 4px 10px; font-size: 13px;
}
.recur__day:has(input:checked) { background: #F0F7FF; border-color: var(--c-primary); }
.recur__summary { margin: 0; }
.recur__summary--error { color: #C62828; background: #FFEBEE; }

/* Меню слота */
.slot-menu { display: flex; flex-direction: column; gap: 8px; }
.slot-menu__hint { font-size: 12px; color: var(--c-muted); margin-bottom: 4px; }
.slot-menu__item {
  text-align: left; border: 1px solid var(--c-line); background: var(--c-surface);
  border-radius: 8px; padding: 12px 14px; cursor: pointer; font-size: 14px;
}
.slot-menu__item:hover { background: #F0F7FF; border-color: var(--c-primary); }

/* Список выбора задач */
.pick-list { max-height: 360px; overflow-y: auto; margin-top: 4px; }
.pick-list__item {
  display: block; width: 100%; text-align: left;
  border: none; border-bottom: 1px solid var(--c-line);
  background: none; padding: 10px 8px; cursor: pointer; font-size: 13px;
}
.pick-list__item:hover { background: #F0F7FF; }

/* --- Тосты --------------------------------------------------------------- */

.toast-container {
  position: fixed; right: 16px; bottom: 16px; z-index: 2000;
  display: flex; flex-direction: column; gap: 8px;
}
.toast {
  min-width: 220px; max-width: 360px; padding: 12px 14px;
  border-radius: 8px; color: #fff; font-size: 13px; cursor: pointer;
  box-shadow: var(--shadow-lg);
  transform: translateY(8px); opacity: 0; transition: all .25s;
}
.toast--visible { transform: translateY(0); opacity: 1; }
.toast--error { background: #E53935; }
.toast--success { background: #43A047; }
.toast--info { background: #455A64; }

</style>
</head>
<body>
  <header class="app-header">
    <div class="app-header__left">
      <div class="app-header__title">📅 Планировщик</div>
      <div class="app-header__nav">
        <button id="nav-prev" class="nav-btn" title="Предыдущая неделя">‹</button>
        <button id="nav-today" class="nav-btn nav-btn--text" title="Текущая неделя">Сегодня</button>
        <button id="nav-next" class="nav-btn" title="Следующая неделя">›</button>
        <div id="week-label" class="app-header__week"></div>
      </div>
    </div>
    <div class="app-header__right">
      <div id="emp-picker" class="app-header__picker"></div>
      <button id="btn-settings" class="icon-btn" title="Настройки">⚙</button>
    </div>
    <div class="app-header__progress"></div>
  </header>

  <main id="calendar" class="calendar"></main>

  <script>
(function () {
/* Сгенерировано tools/build-singlefile.mjs — правьте исходники в js/, не этот файл. */

// ===== js/config.js =====
// Конфигурация приложения-планировщика для Битрикс24.
//
// Приложение встраивается в портал Битрикс24 как placement-приложение и
// работает через BX24 JS SDK (см. js/b24.js). Авторизация выполняется самим
// порталом в рамках iframe — отдельный ключ при этом не требуется.
//
// Если же вы хотите запускать приложение как standalone и обращаться к шлюзу
// vibecode (https://vibecode.bitrix24.tech), включите режим GATEWAY ниже и
// укажите ключ. Весь сетевой контракт шлюза сосредоточен в js/b24.js, чтобы
// при необходимости его было легко поправить в одном месте.

const CONFIG = {
  // 'bx24'    — встраиваемое приложение (BX24 JS SDK). Режим по умолчанию.
  // 'gateway' — standalone-режим через шлюз vibecode с Bearer-ключом.
  transport: 'bx24',

  gateway: {
    baseUrl: 'https://vibecode.bitrix24.tech',
    // Ключ доступа выдаётся в портале Битрикс24 (раздел Вайбкод).
    // ВНИМАНИЕ: это секрет — не публикуйте его в открытых репозиториях.
    accessKey: 'vibe_app_local_6a31460e09cd47_92314079_Ly1fiSDLl3I0qXAlchUuD37a0a7kTtPnNtrp0yj6rmO7ZvuT2i_e30907',
    callPath: '/v1/call',   // POST { method, params } -> { result, error, ... }
    batchPath: '/v1/batch', // POST { halt, cmd } -> { result, error, ... }
  },

  // Сетевые повторы при временных сбоях.
  retry: {
    attempts: 4,
    backoffMs: [2000, 4000, 8000, 16000],
  },
};

// Параметры сетки календаря.
const GRID = {
  workStartHour: 8,   // начало рабочей сетки
  workEndHour: 18,    // конец рабочей сетки
  slotMinutes: 30,    // шаг планирования
  slotHeightPx: 50,   // высота 30-минутного слота
  daysPerWeek: 5,     // ПН–ПТ
  maxEmployees: 5,    // максимум одновременно выбранных сотрудников
};

// Ключи для хранения настроек приложения (на стороне портала Битрикс24).
const OPTION_KEYS = {
  selectedUsers: 'planner_selected_users',
};

// Цветовая схема сущностей.
const COLORS = {
  task: { bg: '#BBDEFB', border: '#64B5F6' },
  event: { bg: '#C8E6C9', border: '#81C784' },
  absence: { bg: '#E0E0E0', border: '#BDBDBD' },
};

// Статусы задач Битрикс24 (tasks.task STATUS) -> человекочитаемое + иконка.
// 2 — ждёт выполнения, 3 — выполняется, 4 — почти завершена, 5 — завершена,
// 6 — отложена, 7 — отклонена. «Просрочена» вычисляется по дедлайну.
const TASK_STATUS = {
  pending:   { code: 2, label: 'Ждёт выполнения', icon: '⏳' },
  inProgress:{ code: 3, label: 'Выполняется',     icon: '▶' },
  deferred:  { code: 6, label: 'Отложена',         icon: '⏸' },
  completed: { code: 5, label: 'Завершена',        icon: '✓' },
  overdue:   { code: -1, label: 'Просрочена',      icon: '⚠' },
};


// ===== js/dates.js =====
// Утилиты для работы с датами и временем. Неделя начинается с понедельника.


const WEEKDAYS_SHORT = ['ВС', 'ПН', 'ВТ', 'СР', 'ЧТ', 'ПТ', 'СБ'];
const MONTHS_GEN = [
  'января', 'февраля', 'марта', 'апреля', 'мая', 'июня',
  'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря',
];

const MS_PER_DAY = 24 * 60 * 60 * 1000;

function startOfDay(date) {
  const d = new Date(date);
  d.setHours(0, 0, 0, 0);
  return d;
}

// Понедельник недели, которой принадлежит date.
function startOfWeek(date) {
  const d = startOfDay(date);
  const day = d.getDay(); // 0=вс ... 6=сб
  const diff = (day === 0 ? -6 : 1 - day); // сдвиг до понедельника
  d.setDate(d.getDate() + diff);
  return d;
}

function addDays(date, days) {
  const d = new Date(date);
  d.setDate(d.getDate() + days);
  return d;
}

function addWeeks(date, weeks) {
  return addDays(date, weeks * 7);
}

// Массив из 5 дат (ПН–ПТ) для недели, содержащей date.
function weekDays(date) {
  const monday = startOfWeek(date);
  return Array.from({ length: GRID.daysPerWeek }, (_, i) => addDays(monday, i));
}

function isSameDay(a, b) {
  return startOfDay(a).getTime() === startOfDay(b).getTime();
}

function isToday(date) {
  return isSameDay(date, new Date());
}

// «ПН, 15 мая»
function formatDayLabel(date) {
  const d = new Date(date);
  return `${WEEKDAYS_SHORT[d.getDay()]}, ${d.getDate()} ${MONTHS_GEN[d.getMonth()]}`;
}

// «15 мая 2026» — для заголовков диапазона.
function formatDateRu(date) {
  const d = new Date(date);
  return `${d.getDate()} ${MONTHS_GEN[d.getMonth()]} ${d.getFullYear()}`;
}

// «HH:MM»
function formatTime(date) {
  const d = new Date(date);
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  return `${hh}:${mm}`;
}

// Дата+время в формате, который ожидают REST-методы Битрикс24:
// «YYYY-MM-DD HH:MM:SS».
function toB24DateTime(date) {
  const d = new Date(date);
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ` +
         `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

// «YYYY-MM-DD» для значений datetime-local и сравнения дней.
function toDateInputValue(date) {
  const d = new Date(date);
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

// «YYYY-MM-DDTHH:MM» для input[type=datetime-local].
function toDateTimeInputValue(date) {
  return `${toDateInputValue(date)}T${formatTime(date)}`;
}

// Разбор значения Битрикс24 (ISO, «YYYY-MM-DD HH:MM:SS» или формат сайта
// «DD.MM.YYYY[ HH:MM[:SS]]», в котором отдаёт даты календарь) в Date.
function parseB24Date(value) {
  if (!value) return null;
  if (value instanceof Date) return value;
  const ru = /^(\d{2})\.(\d{2})\.(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/.exec(String(value).trim());
  if (ru) {
    return new Date(+ru[3], +ru[2] - 1, +ru[1], +(ru[4] || 0), +(ru[5] || 0), +(ru[6] || 0));
  }
  // Битрикс часто отдаёт ISO со смещением — Date справляется.
  let d = new Date(value);
  if (!isNaN(d)) return d;
  // Фолбэк для «YYYY-MM-DD HH:MM:SS».
  d = new Date(String(value).replace(' ', 'T'));
  return isNaN(d) ? null : d;
}

// Сколько минут прошло от начала рабочей сетки (8:00) до date в этот день.
function minutesFromGridStart(date) {
  const d = new Date(date);
  return (d.getHours() - GRID.workStartHour) * 60 + d.getMinutes();
}

// Секунды -> «6.5» часов (одна десятая).
function secondsToHours(seconds) {
  const h = (Number(seconds) || 0) / 3600;
  return Math.round(h * 10) / 10;
}

// Дата начала и конца недели в формате Битрикс24 — для фильтров запросов.
function weekRangeB24(date) {
  const monday = startOfWeek(date);
  const from = startOfDay(monday);
  const to = addDays(from, GRID.daysPerWeek); // включительно по ПТ 23:59
  return {
    from: toB24DateTime(from),
    to: toB24DateTime(new Date(to.getTime() - 1)),
    fromDate: from,
    toDate: new Date(to.getTime() - 1),
  };
}



// ===== js/recurrence.js =====
// Правила повторения для задач, встреч и отсутствий.
//
// Правило (rule):
//   { freq: 'none'|'workdays'|'daily'|'weekly'|'monthly',
//     interval: number,          // «каждые N» дней/недель/месяцев
//     byDay: ['MO', 'WE', ...],  // дни недели для weekly
//     endMode: 'never'|'count'|'until',
//     count: number,             // сколько раз всего (вместе с первым)
//     until: Date|null }         // последний день серии (включительно)
//
// Все повторения хранятся в календаре Битрикс24 (параметр rrule события):
// встречи и отсутствия — как есть, а повторяющаяся работа над задачей —
// серией «слотов задачи» (см. js/data.js). Сама задача в Б24 остаётся одна.


// Предел горизонта разворачивания серии — 5 лет.
const RECUR_HORIZON_DAYS = 366 * 5;
// Календарь Б24 хранит «бесконечные» серии с окончанием 01.01.2038.
const RECUR_NEVER_YEAR = 2038;

const RECUR_FREQS = [
  ['none', 'Не повторять'],
  ['workdays', 'Каждый рабочий день (ПН–ПТ)'],
  ['daily', 'Ежедневно'],
  ['weekly', 'Еженедельно'],
  ['monthly', 'Ежемесячно'],
];

const RECUR_END_MODES = [
  ['never', 'Без даты окончания'],
  ['count', 'После количества повторений'],
  ['until', 'В указанную дату'],
];

// Коды дней недели в порядке ПН..ВС и соответствие Date.getDay().
const RECUR_WEEKDAYS = [
  ['MO', 'ПН'], ['TU', 'ВТ'], ['WE', 'СР'], ['TH', 'ЧТ'], ['FR', 'ПТ'], ['SA', 'СБ'], ['SU', 'ВС'],
];
const RECUR_DAY_BY_JS = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'];
const RECUR_WORKDAYS = ['MO', 'TU', 'WE', 'TH', 'FR'];

function weekdayCode(date) {
  return RECUR_DAY_BY_JS[new Date(date).getDay()];
}

function isRecurring(rule) {
  return !!rule && !!rule.freq && rule.freq !== 'none';
}

// Проверка правила перед сохранением. Бросает Error с понятным текстом.
function validateRule(rule, start) {
  if (!isRecurring(rule)) return;
  if (!(rule.interval >= 1)) throw new Error('Интервал повторения должен быть не меньше 1');
  if (rule.freq === 'weekly' && (!rule.byDay || rule.byDay.length === 0)) {
    throw new Error('Выберите хотя бы один день недели для повторения');
  }
  if (rule.endMode === 'count') {
    if (!(rule.count >= 2)) throw new Error('Количество повторений должно быть не меньше 2');
  } else if (rule.endMode === 'until') {
    if (!rule.until || isNaN(rule.until)) throw new Error('Укажите дату окончания повторений');
    if (startOfDay(rule.until) < startOfDay(start)) {
      throw new Error('Дата окончания повторений раньше начала');
    }
  }
}

// Параметр rrule для calendar.event.add / calendar.event.update.
function toB24RRule(rule) {
  if (!isRecurring(rule)) return null;
  const r = { INTERVAL: rule.interval || 1 };
  switch (rule.freq) {
    case 'workdays':
      r.FREQ = 'WEEKLY';
      r.INTERVAL = 1;
      r.BYDAY = [...RECUR_WORKDAYS];
      break;
    case 'daily': r.FREQ = 'DAILY'; break;
    case 'weekly': r.FREQ = 'WEEKLY'; r.BYDAY = [...rule.byDay]; break;
    case 'monthly': r.FREQ = 'MONTHLY'; break;
    default: return null;
  }
  if (rule.endMode === 'count') r.COUNT = rule.count;
  else if (rule.endMode === 'until') r.UNTIL = formatRuDate(rule.until);
  return r;
}

// «DD.MM.YYYY» — формат даты, который понимает календарь Б24.
function formatRuDate(date) {
  const d = new Date(date);
  const p = (n) => String(n).padStart(2, '0');
  return `${p(d.getDate())}.${p(d.getMonth() + 1)}.${d.getFullYear()}`;
}

// Разбор rrule из календаря Б24 (строка «FREQ=WEEKLY;BYDAY=MO,WE» или объект)
// в правило формы. Неподдерживаемые правила (ежегодно и т.п.) — null.
function parseB24RRule(rr) {
  if (!rr) return null;
  const obj = typeof rr === 'string' ? parseRRuleString(rr) : rr;
  if (!obj || typeof obj !== 'object') return null;
  const freq = String(obj.FREQ || '').toUpperCase();
  if (!freq || freq === 'NONE') return null;

  const interval = Number(obj.INTERVAL) || 1;
  const byDay = normalizeByDay(obj.BYDAY);
  const rule = { freq: '', interval, byDay, endMode: 'never', count: 0, until: null };

  if (freq === 'DAILY') rule.freq = 'daily';
  else if (freq === 'WEEKLY') {
    const isWorkdays = interval === 1 && byDay.length === 5 && RECUR_WORKDAYS.every((d) => byDay.includes(d));
    rule.freq = isWorkdays ? 'workdays' : 'weekly';
  } else if (freq === 'MONTHLY') rule.freq = 'monthly';
  else return null;

  const count = Number(obj.COUNT);
  if (count > 0) {
    rule.endMode = 'count';
    rule.count = count;
  } else if (obj.UNTIL) {
    const until = parseUntil(obj.UNTIL);
    if (until && until.getFullYear() < RECUR_NEVER_YEAR) {
      rule.endMode = 'until';
      rule.until = until;
    }
  }
  return rule;
}

function normalizeByDay(v) {
  if (!v) return [];
  let arr = v;
  if (!Array.isArray(arr)) arr = typeof arr === 'object' ? Object.values(arr) : String(arr).split(',');
  return arr.map((d) => String(d).trim().toUpperCase().slice(-2)).filter((d) => RECUR_DAY_BY_JS.includes(d));
}

// UNTIL встречается как «DD.MM.YYYY», «YYYY-MM-DD», «YYYYMMDD[T…]» или timestamp.
function parseUntil(v) {
  if (typeof v === 'number' || /^\d{9,}$/.test(String(v))) return new Date(Number(v) * 1000);
  const compact = /^(\d{4})(\d{2})(\d{2})/.exec(String(v));
  if (compact && !String(v).includes('-')) return new Date(+compact[1], +compact[2] - 1, +compact[3]);
  const d = parseB24Date(v);
  return d ? startOfDay(d) : null;
}

// «FREQ=WEEKLY;INTERVAL=1;BYDAY=MO,WE» -> { FREQ, INTERVAL, BYDAY: [...] }
function parseRRuleString(str) {
  const out = {};
  for (const part of String(str).split(';')) {
    const [k, v] = part.split('=');
    if (!k || v == null) continue;
    const key = k.trim().toUpperCase();
    out[key] = key === 'BYDAY' ? v.split(',') : v;
  }
  return out;
}

// Разворачивает серию, начинающуюся с start–end, в вхождения { start, end },
// попадающие в окно [from, to). Без окна — все вхождения (с ограничением limit).
function expandOccurrences(rule, start, end, { from = null, to = null, limit = 1000 } = {}) {
  const duration = end - start;
  const inWindow = (s, e) => (!from || e > from) && (!to || s < to);
  if (!isRecurring(rule)) {
    return inWindow(start, end) ? [{ start: new Date(start), end: new Date(end) }] : [];
  }

  const first = startOfDay(start);
  const firstWeek = startOfWeek(start);
  const until = rule.endMode === 'until' && rule.until ? startOfDay(rule.until) : null;
  const maxCount = rule.endMode === 'count' ? rule.count : Infinity;
  const interval = rule.interval || 1;

  const out = [];
  let n = 0;
  for (let i = 0; i <= RECUR_HORIZON_DAYS && n < maxCount && out.length < limit; i++) {
    const day = addDays(first, i);
    if (until && day > until) break;
    if (to && day >= to) break;
    if (!matchesDay(rule, interval, day, first, firstWeek)) continue;
    n++;
    const s = new Date(day);
    s.setHours(start.getHours(), start.getMinutes(), 0, 0);
    const e = new Date(s.getTime() + duration);
    if (inWindow(s, e)) out.push({ start: s, end: e });
  }
  return out;
}

function matchesDay(rule, interval, day, first, firstWeek) {
  const dow = day.getDay();
  switch (rule.freq) {
    case 'workdays':
      return dow >= 1 && dow <= 5;
    case 'daily':
      return diffDays(first, day) % interval === 0;
    case 'weekly': {
      if (!rule.byDay.includes(RECUR_DAY_BY_JS[dow])) return false;
      const weeks = Math.floor(diffDays(firstWeek, startOfWeek(day)) / 7);
      return weeks % interval === 0;
    }
    case 'monthly': {
      if (day.getDate() !== first.getDate()) return false;
      const months = (day.getFullYear() - first.getFullYear()) * 12 + day.getMonth() - first.getMonth();
      return months % interval === 0;
    }
    default:
      return false;
  }
}

// Разница в календарных днях (устойчива к переходу на летнее время).
function diffDays(a, b) {
  return Math.round((startOfDay(b) - startOfDay(a)) / (24 * 60 * 60 * 1000));
}

// Человекочитаемое описание: «Еженедельно по ПН, СР, 10 раз».
function describeRule(rule) {
  if (!isRecurring(rule)) return 'Не повторяется';
  const n = rule.interval || 1;
  let s;
  switch (rule.freq) {
    case 'workdays': s = 'каждый рабочий день'; break;
    case 'daily': s = n > 1 ? `каждые ${n} дн.` : 'ежедневно'; break;
    case 'weekly': {
      const days = RECUR_WEEKDAYS.filter(([c]) => rule.byDay.includes(c)).map(([, l]) => l).join(', ');
      s = (n > 1 ? `каждые ${n} нед.` : 'еженедельно') + ` по ${days}`;
      break;
    }
    case 'monthly': s = n > 1 ? `каждые ${n} мес.` : 'ежемесячно'; break;
    default: s = '';
  }
  if (rule.endMode === 'count') s += `, ${rule.count} раз`;
  else if (rule.endMode === 'until' && rule.until) s += `, до ${formatDateRu(rule.until)}`;
  else s += ', без даты окончания';
  return s.charAt(0).toUpperCase() + s.slice(1);
}

// Описание rrule из календаря Б24 для тултипа.
function describeB24RRule(rr) {
  const rule = parseB24RRule(rr);
  return rule ? describeRule(rule) : 'Повторяется';
}

// ===== js/b24.js =====
// Транспортный слой к Битрикс24.
//
// Один интерфейс — два режима:
//   * 'bx24'    — встраиваемое приложение через глобальный BX24 JS SDK
//                 (подключается в index.html как //api.bitrix24.com/api/v1/).
//   * 'gateway' — standalone через REST-шлюз vibecode с Bearer-ключом.
//
// Наружу отдаём небольшой набор функций: init, callMethod, callListMethod,
// callBatch, getOption, setOption. Весь специфичный для шлюза HTTP-контракт
// сосредоточен здесь — если формат эндпоинта отличается, правится одно место.


class B24Error extends Error {
  constructor(message, code, raw) {
    super(message);
    this.name = 'B24Error';
    this.code = code;
    this.raw = raw;
  }
}

const isGateway = () => CONFIG.transport === 'gateway';

// --- Инициализация -------------------------------------------------------

let bx24Ready = null;

function init() {
  if (isGateway()) return Promise.resolve();
  if (bx24Ready) return bx24Ready;

  bx24Ready = new Promise((resolve, reject) => {
    if (typeof window.BX24 === 'undefined') {
      reject(new B24Error('BX24 JS SDK не загружен. Откройте приложение внутри портала Битрикс24.'));
      return;
    }
    try {
      window.BX24.init(() => resolve());
    } catch (e) {
      reject(new B24Error('Не удалось инициализировать BX24: ' + e.message));
    }
  });
  return bx24Ready;
}

// --- Повторные попытки при сетевых сбоях ----------------------------------

function sleep(ms) {
  return new Promise((r) => setTimeout(r, ms));
}

async function withRetry(fn) {
  const { attempts, backoffMs } = CONFIG.retry;
  let lastErr;
  for (let i = 0; i < attempts; i++) {
    try {
      return await fn();
    } catch (e) {
      lastErr = e;
      // Повторяем только транзиентные ошибки (сеть / 5xx / лимиты).
      if (!isTransient(e) || i === attempts - 1) throw e;
      await sleep(backoffMs[Math.min(i, backoffMs.length - 1)]);
    }
  }
  throw lastErr;
}

function isTransient(e) {
  if (e instanceof B24Error) {
    if (e.code === 'NETWORK') return true;
    if (typeof e.code === 'number' && e.code >= 500) return true;
    if (e.code === 'QUERY_LIMIT_EXCEEDED' || e.code === 'OPERATION_TIME_LIMIT') return true;
    return false;
  }
  return true; // неизвестные ошибки считаем транзиентными
}

// --- Низкоуровневый вызов одного метода -----------------------------------

// Возвращает «сырой» ответ: { result, total, next, error, error_description }.
function rawCall(method, params) {
  return isGateway() ? gatewayCall(method, params) : bx24Call(method, params);
}

function bx24Call(method, params) {
  return new Promise((resolve, reject) => {
    window.BX24.callMethod(method, params || {}, (res) => {
      const err = res.error();
      if (err) {
        const code = (err.ex && err.ex.error) || err.error || 'ERROR';
        const desc = (err.ex && err.ex.error_description) ||
                     err.error_description || String(err);
        reject(new B24Error(desc, code, err));
        return;
      }
      resolve({
        result: res.data(),
        total: res.total ? res.total() : undefined,
        // res.more()/res.next() обрабатываются в callListMethod
        _res: res,
      });
    });
  });
}

async function gatewayCall(method, params) {
  const { baseUrl, callPath, accessKey } = CONFIG.gateway;
  let resp;
  try {
    resp = await fetch(baseUrl + callPath, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + accessKey,
      },
      body: JSON.stringify({ method, params: params || {} }),
    });
  } catch (e) {
    throw new B24Error('Сетевая ошибка: ' + e.message, 'NETWORK', e);
  }
  if (!resp.ok) {
    const text = await resp.text().catch(() => '');
    throw new B24Error(`HTTP ${resp.status}: ${text || resp.statusText}`, resp.status);
  }
  const json = await resp.json().catch(() => ({}));
  if (json.error) {
    throw new B24Error(json.error_description || json.error, json.error, json);
  }
  return { result: json.result, total: json.total, next: json.next };
}

// Один вызов с ретраями. Возвращает result (массив/объект/значение).
async function callMethod(method, params) {
  const raw = await withRetry(() => rawCall(method, params));
  return raw.result;
}

// --- Списочный вызов с прокруткой страниц ----------------------------------
// Собирает все страницы (user.get, tasks.task.list, calendar.event.get, ...).

async function callListMethod(method, params, { resultKey } = {}) {
  if (isGateway()) return gatewayList(method, params, resultKey);
  return bx24List(method, params, resultKey);
}

function extractItems(result, resultKey) {
  if (resultKey && result && typeof result === 'object') return result[resultKey] || [];
  return Array.isArray(result) ? result : (result ? [result] : []);
}

function bx24List(method, params, resultKey) {
  return withRetry(() => new Promise((resolve, reject) => {
    const acc = [];
    window.BX24.callMethod(method, params || {}, function handler(res) {
      const err = res.error();
      if (err) {
        const code = (err.ex && err.ex.error) || err.error || 'ERROR';
        const desc = (err.ex && err.ex.error_description) || err.error_description || String(err);
        reject(new B24Error(desc, code, err));
        return;
      }
      acc.push(...extractItems(res.data(), resultKey));
      if (res.more && res.more()) {
        res.next(); // вызовет handler снова со следующей страницей
      } else {
        resolve(acc);
      }
    });
  }));
}

async function gatewayList(method, params, resultKey) {
  const acc = [];
  let start = 0;
  // Защита от бесконечного цикла.
  for (let guard = 0; guard < 1000; guard++) {
    const p = { ...(params || {}), start };
    const raw = await withRetry(() => gatewayCall(method, p));
    acc.push(...extractItems(raw.result, resultKey));
    if (raw.next === undefined || raw.next === null) break;
    start = raw.next;
  }
  return acc;
}

// --- Батч-вызовы ----------------------------------------------------------
// calls: { key: { method, params } }. Возвращает { key: result }.

async function callBatch(calls) {
  return isGateway() ? gatewayBatch(calls) : bx24Batch(calls);
}

function bx24Batch(calls) {
  return withRetry(() => new Promise((resolve, reject) => {
    const payload = {};
    for (const [key, { method, params }] of Object.entries(calls)) {
      payload[key] = [method, params || {}];
    }
    window.BX24.callBatch(payload, (results) => {
      const out = {};
      for (const key of Object.keys(calls)) {
        const res = results[key];
        if (!res) { out[key] = null; continue; }
        if (res.error && res.error()) {
          // Не валим весь батч из-за одной ошибки — отдаём null и логируем.
          console.warn(`Батч-вызов «${key}» завершился ошибкой:`, res.error());
          out[key] = null;
        } else {
          out[key] = res.data();
        }
      }
      resolve(out);
    }, false);
  }));
}

async function gatewayBatch(calls) {
  const { baseUrl, batchPath, accessKey } = CONFIG.gateway;
  const cmd = {};
  for (const [key, { method, params }] of Object.entries(calls)) {
    const qs = new URLSearchParams(flatten(params || {})).toString();
    cmd[key] = `${method}?${qs}`;
  }
  const raw = await withRetry(async () => {
    let resp;
    try {
      resp = await fetch(baseUrl + batchPath, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + accessKey },
        body: JSON.stringify({ halt: 0, cmd }),
      });
    } catch (e) {
      throw new B24Error('Сетевая ошибка: ' + e.message, 'NETWORK', e);
    }
    if (!resp.ok) throw new B24Error(`HTTP ${resp.status}`, resp.status);
    return resp.json();
  });
  const result = (raw.result && raw.result.result) || raw.result || {};
  return result;
}

// Плоская сериализация параметров для query-строки батча.
function flatten(obj, prefix = '', out = {}) {
  for (const [k, v] of Object.entries(obj)) {
    const key = prefix ? `${prefix}[${k}]` : k;
    if (v !== null && typeof v === 'object') flatten(v, key, out);
    else out[key] = v;
  }
  return out;
}

// --- Настройки приложения (на стороне портала) ----------------------------
// В режиме bx24 используем BX24.appOption (общие для приложения настройки).
// В режиме gateway — REST-методы app.option.get / app.option.set.

async function getOption(key, fallback = null) {
  try {
    if (isGateway()) {
      const res = await callMethod('app.option.get', {});
      const val = res && res[key];
      return val !== undefined && val !== null ? val : fallback;
    }
    const val = window.BX24.appOption.get(key);
    return val !== undefined && val !== null && val !== '' ? val : fallback;
  } catch (e) {
    console.warn('Не удалось прочитать настройку', key, e);
    return fallback;
  }
}

async function setOption(key, value) {
  if (isGateway()) {
    await callMethod('app.option.set', { options: { [key]: value } });
    return;
  }
  await new Promise((resolve, reject) => {
    try {
      window.BX24.appOption.set(key, value, () => resolve());
    } catch (e) {
      reject(new B24Error('Не удалось сохранить настройку: ' + e.message));
    }
  });
}



// ===== js/data.js =====
// Доменный слой: загрузка и сохранение сущностей Битрикс24, приведение их к

//     slot: { eventId, ownerId } | null,   // ячейка-слот работы над задачей
//     recurring, recurrenceLabel, raw }
//
// Одна задача Б24 может занимать несколько ячеек: кроме плановых дат задачи
// работа над ней планируется «слотами» — событиями календаря с меткой
// [task#ID] (в т.ч. повторяющимися). В Б24 при этом задача остаётся одна.

// --- Загрузка данных недели ------------------------------------------------

const TASK_SELECT = [
  'ID', 'TITLE', 'STATUS', 'RESPONSIBLE_ID', 'DESCRIPTION',
  'DEADLINE', 'START_DATE_PLAN', 'END_DATE_PLAN',
  'TIME_ESTIMATE', 'TIME_SPENT_IN_LOGS',
];

// Загружает задачи, события и отсутствия для всех сотрудников за неделю.
// Возвращает Map<userId, item[]>.
async function loadWeekData(userIds, weekDate) {
  const range = weekRangeB24(weekDate);
  const byUser = new Map(userIds.map((id) => [String(id), []]));

  // Формируем батч: на каждого сотрудника — задачи (по плану и по дедлайну)
  // и события календаря.
  const calls = {};
  for (const id of userIds) {
    calls[`task_plan_${id}`] = {
      method: 'tasks.task.list',
      params: {
        filter: {
          RESPONSIBLE_ID: id,
          '>=START_DATE_PLAN': range.from,
          '<=START_DATE_PLAN': range.to,
        },
        select: TASK_SELECT,
      },
    };
    calls[`task_dl_${id}`] = {
      method: 'tasks.task.list',
      params: {
        filter: {
          RESPONSIBLE_ID: id,
          '>=DEADLINE': range.from,
          '<=DEADLINE': range.to,
        },
        select: TASK_SELECT,
      },
    };
    calls[`events_${id}`] = {
      method: 'calendar.event.get',
      params: { type: 'user', ownerId: id, from: range.from, to: range.to },
    };
  }

  const results = await callBatch(calls);

  // Задачи по всем сотрудникам (для слотов могут понадобиться «чужие» недели).
  const tasksById = new Map();
  const tasksByUser = new Map();
  const slotsByUser = new Map();
  const missingTaskIds = new Set();

  for (const id of userIds) {
    const sid = String(id);

    // Задачи: объединяем два набора и убираем дубли по ID.
    const own = new Map();
    for (const key of [`task_plan_${id}`, `task_dl_${id}`]) {
      const res = results[key];
      const tasks = (res && (res.tasks || res)) || [];
      for (const t of (Array.isArray(tasks) ? tasks : [])) {
        const tid = t && (t.id != null ? t.id : t.ID);
        if (tid == null) continue;
        own.set(String(tid), t);
        tasksById.set(String(tid), t);
      }
    }
    tasksByUser.set(sid, own);

    // События календаря: слоты задач отдельно, остальное — встречи/отсутствия.
    const slots = [];
    const events = results[`events_${id}`] || [];
    for (const inst of expandEventInstances(Array.isArray(events) ? events : [], range)) {
      const taskId = slotTaskId(inst.event);
      if (taskId) {
        slots.push({ ...inst, taskId });
        if (!tasksById.has(taskId)) missingTaskIds.add(taskId);
      } else {
        const item = mapEvent(inst, sid);
        if (item) byUser.get(sid).push(item);
      }
    }
    slotsByUser.set(sid, slots);
  }

  // Догружаем задачи, на которые ссылаются слоты, но которых нет в выборке недели.
  if (missingTaskIds.size > 0) {
    try {
      const rows = await callListMethod('tasks.task.list', {
        filter: { ID: [...missingTaskIds] },
        select: TASK_SELECT,
      }, { resultKey: 'tasks' });
      for (const t of rows || []) {
        const tid = t && (t.id != null ? t.id : t.ID);
        if (tid != null) tasksById.set(String(tid), t);
      }
    } catch (e) {
      console.warn('Не удалось загрузить задачи слотов:', e);
    }
  }

  for (const id of userIds) {
    const sid = String(id);
    const items = byUser.get(sid);
    const slots = slotsByUser.get(sid);

    // Слоты работы над задачей — отдельные ячейки одной и той же задачи.
    const slotted = new Set();
    for (const slot of slots) {
      const task = tasksById.get(slot.taskId);
      if (!task) {
        // Задача удалена или недоступна — показываем слот как обычное событие.
        const item = mapEvent(slot, sid);
        if (item) items.push(item);
        continue;
      }
      items.push(mapTaskSlot(task, slot, sid));
      slotted.add(slot.taskId);
    }

    // Сама задача по плановым датам/дедлайну — только если на этой неделе у неё
    // нет слотов (иначе это был бы дубль той же работы).
    for (const [tid, t] of tasksByUser.get(sid)) {
      if (slotted.has(tid)) continue;
      const item = mapTask(t, sid);
      if (item) items.push(item);
    }
  }

  // Доводим «часы за сегодня» для видимых задач.
  await enrichTodayLogged(byUser);

  return byUser;
}

function mapTask(t, userId) {
  const planStart = parseB24Date(t.startDatePlan || t.START_DATE_PLAN);
  const planEnd = parseB24Date(t.endDatePlan || t.END_DATE_PLAN);
  const deadline = parseB24Date(t.deadline || t.DEADLINE);

  let start, end;
  if (planStart && planEnd && planEnd > planStart) {
    start = planStart;
    end = planEnd;
  } else if (deadline) {
    // Без планового интервала — 30-минутный блок, заканчивающийся дедлайном.
    end = deadline;
    start = new Date(deadline.getTime() - GRID.slotMinutes * 60 * 1000);
  } else {
    return null; // нечего размещать на сетке
  }

  return {
    ...taskInfo(t),
    id: 'task_' + (t.id || t.ID),
    userId,
    start, end,
    allDay: false,
    slot: null,
    recurring: false,
    recurrenceLabel: '',
    raw: t,
  };
}

// Ячейка «слота» — запланированная работа над задачей (событие календаря).
function mapTaskSlot(t, inst, userId) {
  const e = inst.event;
  const eventId = String(e.ID || e.id);
  return {
    ...taskInfo(t),
    id: `slot_${eventId}_${inst.start.getTime()}`,
    userId,
    start: inst.start,
    end: inst.end,
    allDay: false,
    slot: { eventId, ownerId: userId },
    recurring: inst.recurring,
    recurrenceLabel: inst.recurring ? describeB24RRule(inst.rrule) : '',
    raw: t,
  };
}

// Общие поля задачи для обычной ячейки и для слота.
function taskInfo(t) {
  const deadline = parseB24Date(t.deadline || t.DEADLINE);
  const statusCode = Number(t.status || t.STATUS);
  const timeEstimate = Number(t.timeEstimate || t.TIME_ESTIMATE || 0);
  const timeSpent = Number(t.timeSpentInLogs || t.TIME_SPENT_IN_LOGS || 0);
  return {
    rawId: String(t.id || t.ID),
    kind: 'task',
    title: t.title || t.TITLE || 'Без названия',
    description: t.description || t.DESCRIPTION || '',
    deadline,
    status: resolveTaskStatus(statusCode, deadline),
    hoursPlan: secondsToHours(timeEstimate),
    hoursFact: secondsToHours(timeSpent),
    hoursToday: 0, // заполняется в enrichTodayLogged
  };
}

function resolveTaskStatus(code, deadline) {
  const completed = code === 5 || code === 4;
  if (!completed && deadline && deadline < new Date()) return TASK_STATUS.overdue;
  switch (code) {
    case 3: return TASK_STATUS.inProgress;
    case 6: return TASK_STATUS.deferred;
    case 4:
    case 5: return TASK_STATUS.completed;
    default: return TASK_STATUS.pending;
  }
}

// Раскладывает события календаря на вхождения недели:
// [{ event, start, end, recurring, rrule }].
// Повторяющиеся события портал обычно отдаёт уже развёрнутыми (у вхождений
// есть поле RINDEX); если пришёл только «родитель» серии — разворачиваем сами.
function expandEventInstances(events, range) {
  const expandedIds = new Set(events
    .filter((e) => e.RINDEX != null && e.RINDEX !== '')
    .map((e) => String(e.ID || e.id)));

  const out = [];
  const seen = new Set();
  const push = (e, start, end, rrule) => {
    const key = String(e.ID || e.id) + '|' + start.getTime();
    if (seen.has(key)) return;
    seen.add(key);
    out.push({ event: e, start, end, recurring: !!rrule, rrule });
  };

  for (const e of events) {
    const start = parseB24Date(e.DATE_FROM || e.dateFrom);
    let end = parseB24Date(e.DATE_TO || e.dateTo);
    if (!start || !end) continue;
    // У событий «на весь день» DATE_TO — начало последнего дня.
    if (isAllDay(e) && end <= start) end = addDays(start, 1);
    else if (isAllDay(e)) end = addDays(startOfDay(end), 1);

    const rrule = eventRRule(e);
    const rule = rrule ? parseB24RRule(rrule) : null;
    const inWeek = end > range.fromDate && start <= range.toDate;
    if (!rule || expandedIds.has(String(e.ID || e.id))) {
      if (inWeek) push(e, start, end, rrule);
      continue;
    }
    const exdates = new Set(String(e.EXDATE || '').split(';').filter(Boolean)
      .map((d) => { const x = parseB24Date(d); return x ? startOfDay(x).getTime() : 0; }));
    for (const o of expandOccurrences(rule, start, end, { from: range.fromDate, to: range.toDate })) {
      if (!exdates.has(startOfDay(o.start).getTime())) push(e, o.start, o.end, rrule);
    }
  }
  return out;
}

function isAllDay(e) {
  return (e.SKIP_TIME || e.skipTime) === 'Y';
}

function eventRRule(e) {
  const rr = e.RRULE || e.rrule || '';
  if (!rr) return '';
  if (typeof rr === 'object' && Object.keys(rr).length === 0) return '';
  return rr;
}

function mapEvent(inst, userId) {
  const e = inst.event;
  const accessibility = (e.ACCESSIBILITY || e.accessibility || '').toLowerCase();
  const isAbsence = accessibility === 'absent';
  const recurring = !!inst.recurring;

  return {
    id: (isAbsence ? 'absence_' : 'event_') + (e.ID || e.id) + (recurring ? '_' + inst.start.getTime() : ''),
    rawId: String(e.ID || e.id),
    kind: isAbsence ? 'absence' : 'event',
    userId,
    title: e.NAME || e.name || (isAbsence ? 'Отсутствие' : 'Событие'),
    description: e.DESCRIPTION || e.description || '',
    start: inst.start,
    end: inst.end,
    allDay: isAllDay(e),
    status: null,
    hoursPlan: 0, hoursFact: 0, hoursToday: 0,
    recurring,
    recurrenceLabel: recurring ? describeB24RRule(inst.rrule) : '',
    raw: e,
  };
}

// Заполняет hoursToday для задач (время, залогированное сегодня).
async function enrichTodayLogged(byUser) {
  const todayStart = startOfDay(new Date());
  const todayEnd = addDays(todayStart, 1);

  // Одна задача может быть в нескольких ячейках (слоты) — группируем по ID.
  const byTask = new Map();
  for (const items of byUser.values()) {
    for (const it of items) {
      if (it.kind !== 'task') continue;
      if (!byTask.has(it.rawId)) byTask.set(it.rawId, []);
      byTask.get(it.rawId).push(it);
    }
  }
  const taskIds = [...byTask.keys()];
  if (taskIds.length === 0) return;

  // Батчим запросы списков затраченного времени порциями по 50.
  for (let i = 0; i < taskIds.length; i += 50) {
    const chunk = taskIds.slice(i, i + 50);
    const calls = {};
    for (const tid of chunk) {
      calls['e_' + tid] = {
        method: 'task.elapseditem.getlist',
        params: {
          ORDER: { ID: 'ASC' },
          FILTER: {
            TASK_ID: tid,
            '>=CREATED_DATE': toB24DateTime(todayStart),
            '<CREATED_DATE': toB24DateTime(todayEnd),
          },
        },
      };
    }
    let results;
    try {
      results = await callBatch(calls);
    } catch (e) {
      console.warn('Не удалось получить часы за сегодня:', e);
      return; // не критично — просто оставим 0
    }
    for (const tid of chunk) {
      const rows = results['e_' + tid];
      if (!Array.isArray(rows)) continue;
      const sec = rows.reduce((s, r) => s + Number(r.SECONDS || r.seconds || 0), 0);
      for (const it of byTask.get(tid)) it.hoursToday = secondsToHours(sec);
    }
  }
}

// --- Слоты работы над задачей ----------------------------------------------
// Слот — событие в календаре сотрудника с меткой [task#ID] в описании.
// Слот может повторяться (rrule), но задача в Битрикс24 остаётся одной.

const SLOT_MARK_RE = /\[task#(\d+)\]/;

function slotTaskId(e) {
  const m = SLOT_MARK_RE.exec(String(e.DESCRIPTION || e.description || ''));
  return m ? m[1] : null;
}

function slotDescription(taskId) {
  return `Запланированная работа над задачей [task#${taskId}]`;
}

async function createTaskSlot({ taskId, title, userId, start, end, rule }) {
  const params = {
    type: 'user',
    ownerId: userId,
    from: toB24DateTime(start),
    to: toB24DateTime(end),
    name: title,
    description: slotDescription(taskId),
    accessibility: 'busy',
    color: COLORS.task.border,
  };
  if (isRecurring(rule)) params.rrule = toB24RRule(rule);
  return callMethod('calendar.event.add', params);
}

// rule: undefined — не менять повторение, null/none — убрать, иначе — задать.
async function updateTaskSlot(eventId, userId, { title, start, end, rule }) {
  const params = { id: eventId, type: 'user', ownerId: userId };
  if (title != null) params.name = title;
  if (start) params.from = toB24DateTime(start);
  if (end) params.to = toB24DateTime(end);
  if (rule !== undefined) params.rrule = isRecurring(rule) ? toB24RRule(rule) : '';
  return callMethod('calendar.event.update', params);
}

async function deleteCalendarEvent(eventId, userId) {
  return callMethod('calendar.event.delete', { id: eventId, type: 'user', ownerId: userId });
}

// Исходное событие серии (дата первого вхождения и правило повторения).
async function loadEventSeries(eventId) {
  const e = await callMethod('calendar.event.getbyid', { id: eventId });
  if (!e) throw new Error('Событие не найдено в календаре');
  const start = parseB24Date(e.DATE_FROM);
  const end = parseB24Date(e.DATE_TO);
  return {
    start, end,
    rule: parseB24RRule(eventRRule(e)),
    rrule: eventRRule(e),
    raw: e,
  };
}

// --- Создание и обновление сущностей --------------------------------------

// Создаёт задачу; возвращает её ID.
async function createTask(payload) {
  const res = await callMethod('tasks.task.add', { fields: taskFields(payload) });
  const t = res && (res.task || res);
  return String(t && (t.id || t.ID));
}

function taskFields({ title, userId, description, start, end, hoursPlan, withDeadline = true }) {
  const fields = {
    TITLE: title,
    RESPONSIBLE_ID: userId,
    DESCRIPTION: description || '',
  };
  if (start) fields.START_DATE_PLAN = toB24DateTime(start);
  if (end) {
    fields.END_DATE_PLAN = toB24DateTime(end);
    if (withDeadline) fields.DEADLINE = toB24DateTime(end);
  }
  if (hoursPlan) fields.TIME_ESTIMATE = Math.round(Number(hoursPlan) * 3600);
  return fields;
}

// Задача с повторяющейся работой: одна задача в Б24 + серия слотов в календаре.
// Плановые даты задачи — первый слот, дедлайн не ставим (серия может быть
// бесконечной; срок при необходимости задаётся в самой задаче).
async function createTaskWithSchedule(payload, rule) {
  if (!isRecurring(rule)) return createTask(payload);
  const taskId = await createTask({ ...payload, withDeadline: false });
  try {
    await createTaskSlot({ taskId, title: payload.title, userId: payload.userId, start: payload.start, end: payload.end, rule });
  } catch (e) {
    throw new Error(`Задача создана, но не удалось запланировать повторения: ${e.message}`);
  }
  return taskId;
}

async function updateTask(rawId, { title, description, start, end, hoursPlan, status, withDeadline = true }) {
  const fields = {};
  if (title != null) fields.TITLE = title;
  if (description != null) fields.DESCRIPTION = description;
  if (start) fields.START_DATE_PLAN = toB24DateTime(start);
  if (end) {
    fields.END_DATE_PLAN = toB24DateTime(end);
    if (withDeadline) fields.DEADLINE = toB24DateTime(end);
  }
  if (hoursPlan != null && hoursPlan !== '') fields.TIME_ESTIMATE = Math.round(Number(hoursPlan) * 3600);
  if (status != null) fields.STATUS = status;
  return callMethod('tasks.task.update', { taskId: rawId, fields });
}

// Привязать существующую задачу к слоту = запланировать работу над ней в
// календаре сотрудника (слот, при необходимости повторяющийся). Сама задача
// не меняется, поэтому одну задачу можно поставить в сколько угодно ячеек.
async function attachTaskToSlot({ taskId, title, userId, start, end, rule }) {
  return createTaskSlot({ taskId, title, userId, start, end, rule });
}

// Список задач сотрудника для привязки (активные, не завершённые).
async function loadUserTasksForPick(userId) {
  const res = await callListMethod('tasks.task.list', {
    filter: { RESPONSIBLE_ID: userId, '<STATUS': 5 },
    select: ['ID', 'TITLE', 'STATUS', 'DEADLINE'],
    order: { ID: 'DESC' },
  }, { resultKey: 'tasks' });
  return (res || []).map((t) => ({
    id: String(t.id || t.ID),
    title: t.title || t.TITLE || 'Без названия',
  }));
}

async function createEvent({ name, userId, description, start, end, kind, rule }) {
  const params = {
    type: 'user',
    ownerId: userId,
    from: toB24DateTime(start),
    to: toB24DateTime(end),
    name,
    description: description || '',
    accessibility: kind === 'absence' ? 'absent' : 'busy',
  };
  // Повторение встреч и отсутствий — штатными средствами календаря.
  if (isRecurring(rule)) params.rrule = toB24RRule(rule);
  return callMethod('calendar.event.add', params);
}

// rule: undefined — не менять повторение, null/none — убрать, иначе — задать.
async function updateEvent(rawId, userId, { name, description, start, end, kind, rule }) {
  const params = { id: rawId, type: 'user', ownerId: userId };
  if (name != null) params.name = name;
  if (description != null) params.description = description;
  if (start) params.from = toB24DateTime(start);
  if (end) params.to = toB24DateTime(end);
  if (kind) params.accessibility = kind === 'absence' ? 'absent' : 'busy';
  if (rule !== undefined) params.rrule = isRecurring(rule) ? toB24RRule(rule) : '';
  return callMethod('calendar.event.update', params);
}



// ===== js/ui/toast.js =====
// Всплывающие уведомления (понятные сообщения об ошибках/успехе).

let container;

function ensureContainer() {
  if (!container) {
    container = document.createElement('div');
    container.className = 'toast-container';
    document.body.appendChild(container);
  }
  return container;
}

function showToast(message, type = 'info', timeout = 4000) {
  const el = document.createElement('div');
  el.className = `toast toast--${type}`;
  el.textContent = message;
  ensureContainer().appendChild(el);
  // запуск анимации появления
  requestAnimationFrame(() => el.classList.add('toast--visible'));
  const remove = () => {
    el.classList.remove('toast--visible');
    setTimeout(() => el.remove(), 250);
  };
  el.addEventListener('click', remove);
  if (timeout) setTimeout(remove, timeout);
}

function showError(err) {
  const msg = err && err.message ? err.message : String(err);
  showToast(msg, 'error', 6000);
}


// ===== js/ui/tooltip.js =====
// Единый тултип с полной информацией о ячейке, следующий за курсором.


let tip;

function ensure() {
  if (!tip) {
    tip = document.createElement('div');
    tip.className = 'tooltip';
    document.body.appendChild(tip);
  }
  return tip;
}

function buildHtml(item) {
  const rows = [];
  rows.push(`<div class="tooltip__title">${escapeHtml(item.title)}</div>`);

  const kindLabel = { task: 'Задача', event: 'Встреча/событие', absence: 'Отсутствие' }[item.kind];
  rows.push(`<div class="tooltip__row"><b>Тип:</b> ${kindLabel}</div>`);

  const timeStr = item.allDay
    ? 'весь день'
    : `${formatTime(item.start)}–${formatTime(item.end)}`;
  rows.push(`<div class="tooltip__row"><b>Время:</b> ${timeStr}</div>`);
  if (item.recurring) {
    rows.push(`<div class="tooltip__row"><b>Повтор:</b> 🔁 ${escapeHtml(item.recurrenceLabel || 'повторяется')}</div>`);
  }

  if (item.slot) {
    rows.push('<div class="tooltip__row"><b>Ячейка:</b> запланированная работа над задачей</div>');
  }
  if (item.kind === 'task') {
    rows.push(`<div class="tooltip__row"><b>Часы:</b> ` +
      `план ${item.hoursPlan}, факт ${item.hoursFact}, сегодня ${item.hoursToday}</div>`);
    if (item.slot && item.deadline) {
      rows.push(`<div class="tooltip__row"><b>Крайний срок:</b> ${formatDayLabel(item.deadline)} ${formatTime(item.deadline)}</div>`);
    }
    if (item.status) {
      rows.push(`<div class="tooltip__row"><b>Статус:</b> ${item.status.icon} ${item.status.label}</div>`);
    }
  }
  if (item.description) {
    rows.push(`<div class="tooltip__row tooltip__desc">${escapeHtml(stripHtml(item.description)).slice(0, 280)}</div>`);
  }
  return rows.join('');
}

function showTooltip(item, x, y) {
  const el = ensure();
  el.innerHTML = buildHtml(item);
  el.classList.add('tooltip--visible');
  moveTooltip(x, y);
}

function moveTooltip(x, y) {
  if (!tip) return;
  const pad = 14;
  const rect = tip.getBoundingClientRect();
  let left = x + pad;
  let top = y + pad;
  if (left + rect.width > window.innerWidth) left = x - rect.width - pad;
  if (top + rect.height > window.innerHeight) top = y - rect.height - pad;
  tip.style.left = Math.max(4, left) + 'px';
  tip.style.top = Math.max(4, top) + 'px';
}

function hideTooltip() {
  if (tip) tip.classList.remove('tooltip--visible');
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
function stripHtml(s) {
  return String(s).replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
}


// ===== js/ui/modals.js =====
// Попапы: меню слота, формы создания/редактирования задач, встреч и отсутствий,
// выбор существующей задачи для привязки к слоту, настройка повторения.


// --- Базовый модальный каркас ---------------------------------------------

function openModal({ title, bodyEl, width = 420 }) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';

  const dialog = document.createElement('div');
  dialog.className = 'modal';
  dialog.style.maxWidth = width + 'px';

  const head = document.createElement('div');
  head.className = 'modal__head';
  head.innerHTML = `<div class="modal__title">${escapeHtml(title)}</div>`;
  const close = document.createElement('button');
  close.className = 'modal__close';
  close.textContent = '×';
  close.addEventListener('click', () => destroy());
  head.appendChild(close);

  dialog.appendChild(head);
  dialog.appendChild(bodyEl);
  overlay.appendChild(dialog);
  document.body.appendChild(overlay);

  const onKey = (e) => { if (e.key === 'Escape') destroy(); };
  overlay.addEventListener('click', (e) => { if (e.target === overlay) destroy(); });
  document.addEventListener('keydown', onKey);

  function destroy() {
    document.removeEventListener('keydown', onKey);
    overlay.remove();
  }
  return { overlay, destroy };
}

// --- Меню при клике по пустому слоту --------------------------------------

// --- Выбор существующей задачи --------------------------------------------
// Задача не копируется и не переносится: в календаре сотрудника создаётся
// слот работы над ней (при желании — повторяющийся).

async function openPickTask({ user, start, end }) {
  const body = document.createElement('div');
  body.className = 'modal__body';
  body.innerHTML = '<div class="form__loading">Загрузка задач…</div>';
  const modal = openModal({ title: 'Запланировать работу над задачей', bodyEl: body, width: 460 });

  let tasks;
  try {
    tasks = await loadUserTasksForPick(user.id);
  } catch (e) { showError(e); modal.destroy(); return; }

  body.innerHTML = '';
  if (tasks.length === 0) {
    body.innerHTML = '<div class="form__loading">У сотрудника нет активных задач.</div>';
    return;
  }
  body.appendChild(metaLine(`${user.name} · ${formatDayLabel(start)} · ${formatTime(start)}–${formatTime(end)}`));

  const fStart = inputRow('Начало', 'datetime-local', toDateTimeInputValue(start));
  const fEnd = inputRow('Окончание', 'datetime-local', toDateTimeInputValue(end));
  body.appendChild(fStart.row);
  body.appendChild(fEnd.row);
  const fRepeat = recurrenceField(fStart.input, fEnd.input, null);
  body.appendChild(fRepeat.row);

  const search = inputRow('Задача', 'text', '');
  search.input.placeholder = 'Поиск по названию';
  body.appendChild(search.row);

  const list = document.createElement('div');
  list.className = 'pick-list';
  body.appendChild(list);

  const render = (q) => {
    list.innerHTML = '';
    const filtered = tasks.filter((t) => t.title.toLowerCase().includes(q.toLowerCase()));
    for (const t of filtered) {
      const item = document.createElement('button');
      item.className = 'pick-list__item';
      item.textContent = t.title;
      item.addEventListener('click', async () => {
        try {
          const s = new Date(fStart.input.value);
          const e = new Date(fEnd.input.value);
          if (!(e > s)) throw new Error('Окончание должно быть позже начала');
          const rule = fRepeat.getRule();
          validateRule(rule, s);
          await attachTaskToSlot({ taskId: t.id, title: t.title, userId: user.id, start: s, end: e, rule });
          showToast(isRecurring(rule) ? 'Работа над задачей запланирована с повторением' : 'Задача запланирована в слот', 'success');
          modal.destroy();
          await bus.reloadWeek();
        } catch (e) { showError(e); }
      });
      list.appendChild(item);
    }
  };
  search.input.addEventListener('input', () => render(search.input.value));
  render('');
}

// --- Форма задачи (создание/редактирование) -------------------------------
// Повторение задачи — это повторяющийся слот работы над ней в календаре;
// задача в Битрикс24 остаётся одна.

async function openTaskForm({ mode, user, start, end, item }) {
  const isEdit = mode === 'edit';
  const isSlot = isEdit && !!item.slot;
  const u = user || selectedUsers().find((x) => x.id === item.userId) || { id: item && item.userId, name: '' };

  // Для повторяющегося слота редактируем серию целиком: берём её начало и правило.
  let series = null;
  if (isSlot && item.recurring) {
    try {
      series = await loadEventSeries(item.slot.eventId);
    } catch (e) { showError(e); return; }
  }
  const seriesRuleUnsupported = !!series && !series.rule;

  const body = document.createElement('div');
  body.className = 'modal__body';

  const startVal = series ? series.start : (isEdit ? item.start : start);
  const endVal = series ? series.end : (isEdit ? item.end : end);

  const fTitle = inputRow('Название задачи *', 'text', isEdit ? item.title : '');
  const fStart = inputRow(series ? 'Начало серии' : 'Начало', 'datetime-local', toDateTimeInputValue(startVal));
  const fEnd = inputRow(series ? 'Окончание (первое вхождение)' : 'Окончание', 'datetime-local', toDateTimeInputValue(endVal));
  const fHours = inputRow('Плановые часы', 'number', isEdit ? item.hoursPlan : '');
  fHours.input.step = '0.5'; fHours.input.min = '0';
  const fDesc = textareaRow('Описание задачи', isEdit ? stripHtml(item.description) : '');

  body.appendChild(metaLine(`Сотрудник: ${u.name || ('ID ' + u.id)}`));
  if (isSlot) {
    body.appendChild(metaLine('Ячейка — запланированная работа над задачей. Время и повторение меняются ' +
      'только у этой ячейки (серии), сама задача в Битрикс24 одна.'));
  }
  body.appendChild(fTitle.row);
  body.appendChild(fStart.row);
  body.appendChild(fEnd.row);

  let fRepeat = null;
  if (seriesRuleUnsupported) {
    fStart.input.disabled = true; fEnd.input.disabled = true;
    body.appendChild(metaLine(`🔁 ${item.recurrenceLabel}. Это правило повторения меняйте в календаре Битрикс24.`));
  } else {
    fRepeat = recurrenceField(fStart.input, fEnd.input, series ? series.rule : null);
    body.appendChild(fRepeat.row);
  }
  body.appendChild(fHours.row);

  let fStatus;
  if (isEdit) {
    fStatus = selectRow('Статус', statusOptions(), String(item.status ? item.status.code : 2));
    body.appendChild(fStatus.row);
  }
  body.appendChild(fDesc.row);

  const title = isEdit ? (isSlot ? 'Работа над задачей' : 'Редактирование задачи') : 'Создать задачу';
  const modal = openModal({ title, bodyEl: body });

  const extra = [];
  if (isSlot) {
    extra.push([item.recurring ? 'Убрать серию из планировщика' : 'Убрать из планировщика', async () => {
      const q = item.recurring
        ? 'Убрать все повторения этой работы из планировщика? Задача в Битрикс24 останется.'
        : 'Убрать ячейку из планировщика? Задача в Битрикс24 останется.';
      if (!window.confirm(q)) return false;
      await deleteCalendarEvent(item.slot.eventId, item.slot.ownerId);
      showToast('Ячейка убрана из планировщика', 'success');
      return true;
    }]);
  }

  addFooter(body, modal, async () => {
    const payload = {
      title: fTitle.input.value.trim(),
      description: fDesc.input.value,
      start: new Date(fStart.input.value),
      end: new Date(fEnd.input.value),
      hoursPlan: fHours.input.value,
    };
    if (!payload.title) throw new Error('Укажите название задачи');
    if (!(payload.end > payload.start)) throw new Error('Окончание должно быть позже начала');
    const rule = fRepeat ? fRepeat.getRule() : undefined;
    if (rule) validateRule(rule, payload.start);
    const status = fStatus ? Number(fStatus.input.value) : undefined;

    if (isSlot) {
      // Поля задачи — в задачу (без дат), время и повторение — в слот.
      await updateTask(item.rawId, { title: payload.title, description: payload.description,
        hoursPlan: payload.hoursPlan, status });
      const slotChange = { title: payload.title };
      if (!seriesRuleUnsupported) {
        slotChange.start = payload.start;
        slotChange.end = payload.end;
        // Правило отправляем, если серия была или появилась.
        if (item.recurring || isRecurring(rule)) slotChange.rule = rule;
      }
      await updateTaskSlot(item.slot.eventId, item.slot.ownerId, slotChange);
      showToast('Задача обновлена', 'success');
    } else if (isEdit) {
      if (isRecurring(rule)) {
        // Обычная задача становится повторяющейся: плановые даты — первое
        // вхождение, повторения — серией слотов в календаре.
        await updateTask(item.rawId, { ...payload, status, withDeadline: false });
        await createTaskSlot({ taskId: item.rawId, title: payload.title, userId: u.id,
          start: payload.start, end: payload.end, rule });
        showToast('Задача обновлена, повторения запланированы', 'success');
      } else {
        await updateTask(item.rawId, { ...payload, status });
        showToast('Задача обновлена', 'success');
      }
    } else {
      await createTaskWithSchedule({ ...payload, userId: u.id }, rule);
      showToast(isRecurring(rule) ? 'Задача создана, повторения запланированы' : 'Задача создана', 'success');
    }
  }, extra);
}

function openEditModal(item) {

  else openEventForm({ mode: 'edit', item });

// --- Блок «Повторение» ----------------------------------------------------
// startInput/endInput — поля начала и окончания формы (для подсказки и дня
// недели по умолчанию). initial — правило для предзаполнения (или null).

function recurrenceField(startInput, endInput, initial) {
  const init = initial || { freq: 'none', interval: 1, byDay: [], endMode: 'never', count: 10, until: null };

  const row = document.createElement('div');
  row.className = 'form__row recur';

  const fFreq = selectRow('Повторение', RECUR_FREQS, init.freq);
  fFreq.row.classList.add('recur__freq');
  row.appendChild(fFreq.row);

  const details = document.createElement('div');
  details.className = 'recur__details';
  row.appendChild(details);

  // «Каждые N …»
  const fInterval = inputRow('Каждые', 'number', String(init.interval || 1));
  fInterval.input.min = '1'; fInterval.input.max = '99'; fInterval.input.step = '1';
  const intervalUnit = document.createElement('span');
  intervalUnit.className = 'recur__unit';
  fInterval.row.classList.add('recur__interval');
  fInterval.row.appendChild(intervalUnit);
  details.appendChild(fInterval.row);

  // Дни недели для «Еженедельно».
  const daysRow = document.createElement('div');
  daysRow.className = 'form__row recur__days';
  const daysLabel = document.createElement('span');
  daysLabel.className = 'form__label';
  daysLabel.textContent = 'По дням';
  daysRow.appendChild(daysLabel);
  const dayBoxes = new Map();
  for (const [code, label] of RECUR_WEEKDAYS) {
    const chip = document.createElement('label');
    chip.className = 'recur__day';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.value = code;
    cb.checked = (init.byDay || []).includes(code);
    chip.appendChild(cb);
    chip.appendChild(document.createTextNode(label));
    daysRow.appendChild(chip);
    dayBoxes.set(code, cb);
  }
  details.appendChild(daysRow);

  // Окончание серии: никогда, после N раз или в дату.
  const fEndMode = selectRow('Завершить', RECUR_END_MODES, init.endMode || 'never');
  details.appendChild(fEndMode.row);
  const fCount = inputRow('Количество повторений (вместе с первым)', 'number', String(init.count || 10));
  fCount.input.min = '2'; fCount.input.step = '1';
  details.appendChild(fCount.row);
  const fUntil = inputRow('Повторять до (включительно)', 'date', init.until ? toDateInputValue(init.until) : '');
  details.appendChild(fUntil.row);

  const summary = document.createElement('div');
  summary.className = 'form__meta recur__summary';
  details.appendChild(summary);

  let daysTouched = (init.byDay || []).length > 0;
  for (const cb of dayBoxes.values()) cb.addEventListener('change', () => { daysTouched = true; refresh(); });

  function getRule() {
    return {
      freq: fFreq.input.value,
      interval: Math.floor(Number(fInterval.input.value)) || 0,
      byDay: [...dayBoxes.values()].filter((cb) => cb.checked).map((cb) => cb.value),
      endMode: fEndMode.input.value,
      count: Math.floor(Number(fCount.input.value)) || 0,
      until: fUntil.input.value ? new Date(fUntil.input.value + 'T00:00') : null,
    };
  }

  function refresh() {
    const freq = fFreq.input.value;
    const start = new Date(startInput.value);
    const end = new Date(endInput.value);
    details.hidden = freq === 'none';
    fInterval.row.hidden = freq === 'workdays';
    daysRow.hidden = freq !== 'weekly';
    fCount.row.hidden = fEndMode.input.value !== 'count';
    fUntil.row.hidden = fEndMode.input.value !== 'until';
    intervalUnit.textContent = { daily: 'дн.', weekly: 'нед.', monthly: 'мес.' }[freq] || '';

    // По умолчанию — день недели начала; дата окончания — через месяц.
    if (!isNaN(start)) {
      if (!daysTouched) {
        const code = weekdayCode(start);
        for (const [c, cb] of dayBoxes) cb.checked = c === code;
      }
      if (!fUntil.input.value) fUntil.input.value = toDateInputValue(addDays(start, 30));
    }

    if (freq === 'none') return;
    try {
      if (isNaN(start) || !(end > start)) throw new Error('Укажите начало и окончание');
      const rule = getRule();
      validateRule(rule, start);
      summary.textContent = '🔁 ' + describeRule(rule);
      summary.classList.remove('recur__summary--error');
    } catch (e) {
      summary.textContent = e.message;
      summary.classList.add('recur__summary--error');
    }
  }

  for (const inp of [fFreq.input, fInterval.input, fEndMode.input, fCount.input, fUntil.input, startInput, endInput]) {
    inp.addEventListener('input', refresh);
    inp.addEventListener('change', refresh);
  }
  refresh();

  return { row, getRule };
}

// --- Общие элементы формы -------------------------------------------------

// extra — дополнительные кнопки слева: [[текст, async () => закрыть?], ...].
function addFooter(body, modal, onSubmit, extra = []) {
  const footer = document.createElement('div');
  footer.className = 'modal__footer';
  for (const [label, fn] of extra) {
    const btn = document.createElement('button');
    btn.className = 'btn btn--danger';
    btn.textContent = label;
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      try {
        if (await fn()) {
          modal.destroy();
          await bus.reloadWeek();
          return;
        }
      } catch (e) { showError(e); }
      btn.disabled = false;
    });
    footer.appendChild(btn);
  }
  const cancel = document.createElement('button');
  cancel.className = 'btn btn--ghost';
  cancel.textContent = 'Отмена';
  cancel.addEventListener('click', () => modal.destroy());
  const save = document.createElement('button');
  save.className = 'btn btn--primary';
  save.textContent = 'Сохранить';
  save.addEventListener('click', async () => {
    save.disabled = true; save.textContent = 'Сохранение…';
    try {
      await onSubmit();
      modal.destroy();
      await bus.reloadWeek();
    } catch (e) {
      showError(e);
      save.disabled = false; save.textContent = 'Сохранить';
    }
  });
  footer.appendChild(cancel);
  footer.appendChild(save);
  body.appendChild(footer);
}

function metaLine(text) {
  const d = document.createElement('div');
  d.className = 'form__meta';
  d.textContent = text;
  return d;
}

function inputRow(label, type, value) {
  const row = document.createElement('label');
  row.className = 'form__row';
  const span = document.createElement('span');
  span.className = 'form__label';
  span.textContent = label;
  const input = document.createElement('input');
  input.className = 'form__input';
  input.type = type;
  if (value !== undefined && value !== null) input.value = value;
  row.appendChild(span); row.appendChild(input);
  return { row, input };
}

function textareaRow(label, value) {
  const row = document.createElement('label');
  row.className = 'form__row';
  const span = document.createElement('span');
  span.className = 'form__label';
  span.textContent = label;
  const input = document.createElement('textarea');
  input.className = 'form__input form__textarea';
  input.rows = 3;
  input.value = value || '';
  row.appendChild(span); row.appendChild(input);
  return { row, input };
}

function selectRow(label, options, value) {
  const row = document.createElement('label');
  row.className = 'form__row';
  const span = document.createElement('span');
  span.className = 'form__label';
  span.textContent = label;
  const input = document.createElement('select');
  input.className = 'form__input';
  for (const [val, text] of options) {

    if (val === value) opt.selected = true;
