<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Планировщик — Битрикс24</title>
  <style>
/* Планировщик для Битрикс24 — минималистичный Material-стиль. */

:root {
  --c-task-bg: #BBDEFB;   --c-task-br: #64B5F6;
  --c-event-bg: #C8E6C9;  --c-event-br: #81C784;
  --c-absence-bg: #E0E0E0;--c-absence-br: #BDBDBD;
  --c-primary: #2196F3;
  --c-text: #212121;      --c-muted: #757575;
  --c-line: #E0E0E0;      --c-line-strong: #BDBDBD;
  --c-bg: #FAFAFA;        --c-surface: #FFFFFF;
  --header-h: 56px;
  --day-head-h: 34px;
  --sub-head-h: 26px;
  --shadow: 0 2px 8px rgba(0,0,0,.12);
  --shadow-lg: 0 8px 28px rgba(0,0,0,.20);
}

* { box-sizing: border-box; }

html, body {
  margin: 0; height: 100%;
  font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color: var(--c-text); background: var(--c-bg);
  font-size: 14px;
}

/* --- Шапка --------------------------------------------------------------- */

.app-header {
  position: relative;
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; height: var(--header-h);
  padding: 0 16px;
  background: var(--c-surface);
  border-bottom: 1px solid var(--c-line);
  box-shadow: 0 1px 3px rgba(0,0,0,.08);
  z-index: 20;
}
.app-header__left, .app-header__right { display: flex; align-items: center; gap: 14px; }
.app-header__title { font-weight: 600; font-size: 16px; white-space: nowrap; }
.app-header__nav { display: flex; align-items: center; gap: 6px; }
.app-header__week { font-weight: 500; color: var(--c-muted); margin-left: 8px; white-space: nowrap; }

.nav-btn {
  border: 1px solid var(--c-line); background: var(--c-surface);
  border-radius: 8px; cursor: pointer; font-size: 18px; line-height: 1;
  width: 32px; height: 32px; color: var(--c-text);
  display: inline-flex; align-items: center; justify-content: center;
  transition: background .15s;
}
.nav-btn--text { width: auto; padding: 0 12px; font-size: 13px; }
.nav-btn:hover { background: #F0F0F0; }

.icon-btn {
  border: 1px solid var(--c-line); background: var(--c-surface);
  border-radius: 8px; cursor: pointer; font-size: 18px;
  width: 36px; height: 36px;
  display: inline-flex; align-items: center; justify-content: center;
  transition: background .15s;
}
.icon-btn:hover { background: #F0F0F0; }

.app-header__progress {
  position: absolute; left: 0; bottom: -1px; height: 3px; width: 0;
  background: var(--c-primary); transition: width .3s ease;
}
body.is-loading .app-header__progress {
  width: 100%;
  animation: progress 1.2s ease-in-out infinite;
}
@keyframes progress {
  0% { width: 0; opacity: 1; } 50% { width: 70%; } 100% { width: 100%; opacity: .3; }
}

/* --- Мультиселект сотрудников ------------------------------------------- */

.emp-picker { position: relative; }
.emp-picker__button {
  display: inline-flex; align-items: center; gap: 8px;
  max-width: 360px; height: 36px; padding: 0 12px;
  border: 1px solid var(--c-line); border-radius: 8px;
  background: var(--c-surface); cursor: pointer; font-size: 13px;
}
.emp-picker__label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.emp-picker__caret { color: var(--c-muted); }
.emp-picker__panel {
  position: absolute; right: 0; top: calc(100% + 6px);
  width: 320px; background: var(--c-surface);
  border: 1px solid var(--c-line); border-radius: 10px;
  box-shadow: var(--shadow-lg); z-index: 30; padding: 10px;
}

.emp-panel--embedded { margin-top: 10px; }
.emp-panel__search {
  width: 100%; height: 34px; padding: 0 10px; margin-bottom: 8px;
  border: 1px solid var(--c-line); border-radius: 8px; font-size: 13px;
}
.emp-panel__counter { font-size: 12px; color: var(--c-muted); margin-bottom: 6px; }
.emp-panel__list { max-height: 320px; overflow-y: auto; }
.emp-panel__empty { color: var(--c-muted); padding: 10px; text-align: center; }

.emp-row {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 6px; border-radius: 8px; cursor: pointer;
}
.emp-row:hover { background: #F5F5F5; }
.emp-row--disabled { opacity: .45; cursor: not-allowed; }
.emp-row input { width: 16px; height: 16px; }
.emp-row__name { font-size: 13px; }
.emp-row__pos { font-size: 11px; color: var(--c-muted); }

/* --- Календарь ----------------------------------------------------------- */

.calendar { height: calc(100vh - var(--header-h)); overflow: hidden; }
.cal-scroll-y { height: 100%; overflow: auto; }
.cal-grid { display: flex; width: max-content; min-width: 100%; }

.cal-empty {
  height: 100%; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 8px; color: var(--c-muted);
}
.cal-empty__icon { font-size: 48px; }
.cal-empty__text { font-size: 18px; font-weight: 500; color: var(--c-text); }
.cal-empty__hint { font-size: 13px; }

/* Временная шкала слева */
.cal-time {
  position: sticky; left: 0; z-index: 6;
  width: 64px; flex: 0 0 64px; background: var(--c-surface);
  border-right: 1px solid var(--c-line-strong);
}
.cal-time__header {
  height: calc(var(--day-head-h) + var(--sub-head-h));
  position: sticky; top: 0; z-index: 7; background: var(--c-surface);
  border-bottom: 1px solid var(--c-line-strong);
}
.cal-time__slot {
  position: relative; border-bottom: 1px dashed var(--c-line);
  font-size: 11px; color: var(--c-muted); text-align: right;
  padding-right: 6px;
}
.cal-time__slot--hour { color: var(--c-text); border-bottom: 1px solid var(--c-line-strong); }

/* Колонка дня */
.cal-day {
  flex: 1 0 auto; min-width: 180px;
  border-right: 1px solid var(--c-line-strong);
}
.cal-day--today { background: rgba(33,150,243,.03); }
.cal-day__header {
  position: sticky; top: 0; z-index: 5;
  height: var(--day-head-h); line-height: var(--day-head-h);
  text-align: center; font-weight: 600; font-size: 13px;
  background: var(--c-surface); border-bottom: 1px solid var(--c-line);
}
.cal-day--today .cal-day__header { color: var(--c-primary); }
.cal-day__sub {
  position: sticky; top: var(--day-head-h); z-index: 4;
  display: flex; height: var(--sub-head-h);
  background: var(--c-surface); border-bottom: 1px solid var(--c-line-strong);
}
.cal-day__sub-cell {
  flex: 1 1 0; min-width: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: var(--c-muted);
  border-left: 1px solid var(--c-line); overflow: hidden;
  white-space: nowrap; text-overflow: ellipsis; padding: 0 4px;
}
.cal-day__sub-cell:first-child { border-left: none; }

.cal-day__body { display: flex; }
.cal-subcol {
  position: relative; flex: 1 1 0; min-width: 0;
  border-left: 1px solid var(--c-line);
}
.cal-subcol:first-child { border-left: none; }

.cal-slot { border-bottom: 1px dashed var(--c-line); cursor: pointer; }
.cal-slot:nth-child(2n) { border-bottom: 1px solid var(--c-line); }
.cal-slot:hover { background: rgba(33,150,243,.06); }

/* Блок сущности */
.cal-block {
  position: absolute; z-index: 2;
  border: 1px solid; border-left-width: 3px; border-radius: 5px;
  padding: 3px 5px; overflow: hidden; cursor: pointer;
  box-shadow: 0 1px 2px rgba(0,0,0,.10); font-size: 12px;
}
.cal-block:hover { box-shadow: var(--shadow); z-index: 3; }
.cal-block--edge { opacity: .9; }
.cal-block__content { display: flex; flex-direction: column; gap: 2px; height: 100%; }
.cal-block__title {
  font-weight: 600; line-height: 1.15;
  overflow: hidden; text-overflow: ellipsis;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.cal-block__meta {
  display: flex; align-items: center; gap: 5px;
  font-size: 11px; color: #37474F; margin-top: auto;
}
.cal-block__hours { font-variant-numeric: tabular-nums; font-weight: 600; }
.cal-block__status { font-size: 12px; }

.cal-block__edit {
  position: absolute; top: 2px; right: 2px;
  width: 20px; height: 20px; border: none; border-radius: 5px;
  background: rgba(255,255,255,.85); cursor: pointer; font-size: 12px;
  display: none; align-items: center; justify-content: center;
}
.cal-block:hover .cal-block__edit { display: inline-flex; }
.cal-block__edit:hover { background: #fff; }

.cal-block__edge {
  position: absolute; left: 0; right: 0;
  font-size: 9px; text-align: center; color: #455A64;
  background: rgba(0,0,0,.10); line-height: 12px; height: 12px;
}
.cal-block__edge--top { top: 0; }
.cal-block__edge--bottom { bottom: 0; }

/* Планируемая задача — пунктирная рамка, чтобы отличать от реальных сущностей. */
.cal-block--placement { border-style: dashed; }

/* Ручки изменения длительности по краям ячейки. */
.cal-block__resize {
  position: absolute; left: 0; right: 0; height: 7px;
  cursor: ns-resize; z-index: 4;
}
.cal-block__resize--top { top: 0; }
.cal-block__resize--bottom { bottom: 0; }
.cal-block:hover .cal-block__resize { background: rgba(0,0,0,.08); }
body.is-resizing { cursor: ns-resize; user-select: none; }

/* --- Тултип -------------------------------------------------------------- */

.tooltip {
  position: fixed; z-index: 1000; max-width: 320px;
  background: #263238; color: #fff; border-radius: 8px;
  padding: 10px 12px; font-size: 12px; line-height: 1.45;
  box-shadow: var(--shadow-lg); pointer-events: none;
  opacity: 0; visibility: hidden; transition: opacity .12s;
}
.tooltip--visible { opacity: 1; visibility: visible; }
.tooltip__title { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
.tooltip__row { margin-top: 2px; }
.tooltip__row b { color: #B0BEC5; font-weight: 500; }
.tooltip__desc { margin-top: 6px; color: #CFD8DC; border-top: 1px solid #37474F; padding-top: 6px; }

/* --- Модальные окна ------------------------------------------------------ */

.modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,.40);
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
.modal {
  width: 100%; background: var(--c-surface);
  border-radius: 12px; box-shadow: var(--shadow-lg);
  max-height: 90vh; overflow: hidden; display: flex; flex-direction: column;
}
.modal__head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; border-bottom: 1px solid var(--c-line);
}
.modal__title { font-weight: 600; font-size: 15px; }
.modal__close {
  border: none; background: none; cursor: pointer; font-size: 22px;
  line-height: 1; color: var(--c-muted);
}
.modal__close:hover { color: var(--c-text); }
.modal__body { padding: 16px; overflow-y: auto; }
.modal__footer {
  display: flex; justify-content: flex-end; gap: 8px;
  margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--c-line);
}

.btn {
  border: 1px solid transparent; border-radius: 8px; cursor: pointer;
  font-size: 13px; padding: 9px 16px; font-weight: 500;
}
.btn--primary { background: var(--c-primary); color: #fff; }
.btn--primary:hover { background: #1E88E5; }
.btn--primary:disabled { opacity: .6; cursor: default; }
.btn--ghost { background: var(--c-surface); border-color: var(--c-line); color: var(--c-text); }
.btn--ghost:hover { background: #F5F5F5; }

.form__row { display: block; margin-bottom: 12px; }
.form__label { display: block; font-size: 12px; color: var(--c-muted); margin-bottom: 4px; }
.form__input {
  width: 100%; height: 38px; padding: 0 10px;
  border: 1px solid var(--c-line); border-radius: 8px; font-size: 14px;
  font-family: inherit;
}
.form__textarea { height: auto; padding: 8px 10px; resize: vertical; }
.form__input:focus { outline: none; border-color: var(--c-primary); }
.form__meta {
  font-size: 13px; color: var(--c-muted);
  background: #F5F5F5; padding: 8px 10px; border-radius: 8px; margin-bottom: 12px;
}
.form__loading { padding: 20px; text-align: center; color: var(--c-muted); }

/* Меню слота */
.slot-menu { display: flex; flex-direction: column; gap: 8px; }
.slot-menu__hint { font-size: 12px; color: var(--c-muted); margin-bottom: 4px; }
.slot-menu__item {
  text-align: left; border: 1px solid var(--c-line); background: var(--c-surface);
  border-radius: 8px; padding: 12px 14px; cursor: pointer; font-size: 14px;
}
.slot-menu__item:hover { background: #F0F7FF; border-color: var(--c-primary); }

/* Список выбора задач */
.pick-list { max-height: 360px; overflow-y: auto; margin-top: 4px; }
.pick-list__item {
  display: block; width: 100%; text-align: left;
  border: none; border-bottom: 1px solid var(--c-line);
  background: none; padding: 10px 8px; cursor: pointer; font-size: 13px;
}
.pick-list__item:hover { background: #F0F7FF; }

/* --- Тосты --------------------------------------------------------------- */

.toast-container {
  position: fixed; right: 16px; bottom: 16px; z-index: 2000;
  display: flex; flex-direction: column; gap: 8px;
}
.toast {
  min-width: 220px; max-width: 360px; padding: 12px 14px;
  border-radius: 8px; color: #fff; font-size: 13px; cursor: pointer;
  box-shadow: var(--shadow-lg);
  transform: translateY(8px); opacity: 0; transition: all .25s;
}
.toast--visible { transform: translateY(0); opacity: 1; }
.toast--error { background: #E53935; }
.toast--success { background: #43A047; }
.toast--info { background: #455A64; }

</style>
</head>
<body>
  <header class="app-header">
    <div class="app-header__left">
      <div class="app-header__title">📅 Планировщик</div>
      <div class="app-header__nav">
        <button id="nav-prev" class="nav-btn" title="Предыдущая неделя">‹</button>
        <button id="nav-today" class="nav-btn nav-btn--text" title="Текущая неделя">Сегодня</button>
        <button id="nav-next" class="nav-btn" title="Следующая неделя">›</button>
        <div id="week-label" class="app-header__week"></div>
      </div>
    </div>
    <div class="app-header__right">
      <div id="emp-picker" class="app-header__picker"></div>
      <button id="btn-settings" class="icon-btn" title="Настройки">⚙</button>
    </div>
    <div class="app-header__progress"></div>
  </header>

  <main id="calendar" class="calendar"></main>

  <script>
(function () {
/* Сгенерировано tools/build-singlefile.mjs — правьте исходники в js/, не этот файл. */

// ===== js/config.js =====
// Конфигурация приложения-планировщика для Битрикс24.
//
// Приложение размещается на хостинге vibecode по BFF-схеме: шлюз авторизует
// пользователя портала и проксирует REST. Фронтенд ходит на собственный
// бэкенд (`/api/v1/*`, см. server/bff.py), который подставляет сессию шлюза и
// обращается к REST vibecode. Секретов/ключей во фронтенде нет — токен сессии
// живёт только между шлюзом и сервером приложения.

const CONFIG = {
  // Базовый путь к BFF-прокси (тот же origin, что и страница).
  apiBase: '/api/v1',

  // Сетевые повторы при временных сбоях.
  retry: {
    attempts: 4,
    backoffMs: [2000, 4000, 8000, 16000],
  },
};

// Параметры сетки календаря.
const GRID = {
  workStartHour: 8,   // начало рабочей сетки
  workEndHour: 18,    // конец рабочей сетки
  slotMinutes: 30,    // шаг планирования
  slotHeightPx: 50,   // высота 30-минутного слота
  daysPerWeek: 5,     // ПН–ПТ
  maxEmployees: 5,    // максимум одновременно выбранных сотрудников
};

// Ключи для хранения настроек приложения (на стороне портала Битрикс24).
const OPTION_KEYS = {
  selectedUsers: 'planner_selected_users',
};

// Цветовая схема сущностей.
const COLORS = {
  task: { bg: '#BBDEFB', border: '#64B5F6' },
  event: { bg: '#C8E6C9', border: '#81C784' },
  absence: { bg: '#E0E0E0', border: '#BDBDBD' },
  // Планирование задачи (локальная ячейка, саму задачу не меняет).
  placement: { bg: '#FFE0B2', border: '#FFB74D' },
};

// Статусы задач Битрикс24 (tasks.task STATUS) -> человекочитаемое + иконка.
// 2 — ждёт выполнения, 3 — выполняется, 4 — почти завершена, 5 — завершена,
// 6 — отложена, 7 — отклонена. «Просрочена» вычисляется по дедлайну.
const TASK_STATUS = {
  pending:   { code: 2, label: 'Ждёт выполнения', icon: '⏳' },
  inProgress:{ code: 3, label: 'Выполняется',     icon: '▶' },
  deferred:  { code: 6, label: 'Отложена',         icon: '⏸' },
  completed: { code: 5, label: 'Завершена',        icon: '✓' },
  overdue:   { code: -1, label: 'Просрочена',      icon: '⚠' },
};


// ===== js/dates.js =====
// Утилиты для работы с датами и временем. Неделя начинается с понедельника.


const WEEKDAYS_SHORT = ['ВС', 'ПН', 'ВТ', 'СР', 'ЧТ', 'ПТ', 'СБ'];
const MONTHS_GEN = [
  'января', 'февраля', 'марта', 'апреля', 'мая', 'июня',
  'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря',
];

const MS_PER_DAY = 24 * 60 * 60 * 1000;

function startOfDay(date) {
  const d = new Date(date);
  d.setHours(0, 0, 0, 0);
  return d;
}

// Понедельник недели, которой принадлежит date.
function startOfWeek(date) {
  const d = startOfDay(date);
  const day = d.getDay(); // 0=вс ... 6=сб
  const diff = (day === 0 ? -6 : 1 - day); // сдвиг до понедельника
  d.setDate(d.getDate() + diff);
  return d;
}

function addDays(date, days) {
  const d = new Date(date);
  d.setDate(d.getDate() + days);
  return d;
}

function addWeeks(date, weeks) {
  return addDays(date, weeks * 7);
}

// Массив из 5 дат (ПН–ПТ) для недели, содержащей date.
function weekDays(date) {
  const monday = startOfWeek(date);
  return Array.from({ length: GRID.daysPerWeek }, (_, i) => addDays(monday, i));
}

function isSameDay(a, b) {
  return startOfDay(a).getTime() === startOfDay(b).getTime();
}

function isToday(date) {
  return isSameDay(date, new Date());
}

// «ПН, 15 мая»
function formatDayLabel(date) {
  const d = new Date(date);
  return `${WEEKDAYS_SHORT[d.getDay()]}, ${d.getDate()} ${MONTHS_GEN[d.getMonth()]}`;
}

// «15 мая 2026» — для заголовков диапазона.
function formatDateRu(date) {
  const d = new Date(date);
  return `${d.getDate()} ${MONTHS_GEN[d.getMonth()]} ${d.getFullYear()}`;
}

// «HH:MM»
function formatTime(date) {
  const d = new Date(date);
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  return `${hh}:${mm}`;
}

// Дата+время в формате, который ожидают REST-методы Битрикс24:
// «YYYY-MM-DD HH:MM:SS».
function toB24DateTime(date) {
  const d = new Date(date);
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ` +
         `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

// «YYYY-MM-DD» для значений datetime-local и сравнения дней.
function toDateInputValue(date) {
  const d = new Date(date);
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

// «YYYY-MM-DDTHH:MM» для input[type=datetime-local].
function toDateTimeInputValue(date) {
  return `${toDateInputValue(date)}T${formatTime(date)}`;
}

// Разбор значения Битрикс24 (ISO или «YYYY-MM-DD HH:MM:SS») в Date.
function parseB24Date(value) {
  if (!value) return null;
  if (value instanceof Date) return value;
  // Битрикс часто отдаёт ISO со смещением — Date справляется.
  let d = new Date(value);
  if (!isNaN(d)) return d;
  // Фолбэк для «YYYY-MM-DD HH:MM:SS».
  d = new Date(String(value).replace(' ', 'T'));
  return isNaN(d) ? null : d;
}

// Сколько минут прошло от начала рабочей сетки (8:00) до date в этот день.
function minutesFromGridStart(date) {
  const d = new Date(date);
  return (d.getHours() - GRID.workStartHour) * 60 + d.getMinutes();
}

// Секунды -> «6.5» часов (одна десятая).
function secondsToHours(seconds) {
  const h = (Number(seconds) || 0) / 3600;
  return Math.round(h * 10) / 10;
}

// Дата начала и конца недели в формате Битрикс24 — для фильтров запросов.
function weekRangeB24(date) {
  const monday = startOfWeek(date);
  const from = startOfDay(monday);
  const to = addDays(from, GRID.daysPerWeek); // включительно по ПТ 23:59
  return {
    from: toB24DateTime(from),
    to: toB24DateTime(new Date(to.getTime() - 1)),
    fromDate: from,
    toDate: new Date(to.getTime() - 1),
  };
}

// ===== js/b24.js =====
// Транспортный слой к REST Битрикс24 через собственный BFF.
//
// Схема vibecode: шлюз авторизует пользователя портала и на пути «шлюз ->
// сервер приложения» подставляет заголовок сессии. Браузер токен не видит,
// поэтому фронтенд обращается к нашему бэкенду `/api/v1/*` (server/bff.py),
// а тот уже проксирует на REST vibecode (`/v1/*`) с этой сессией.
//
// Наружу отдаём: init, apiGet, apiSend, getOption, setOption, OPTION_KEYS.


class B24Error extends Error {
  constructor(message, code, raw) {
    super(message);
    this.name = 'B24Error';
    this.code = code;
    this.raw = raw;
  }
}

// --- Инициализация: проверяем, что шлюз отдал сессию --------------------

let ready = null;

function init() {
  if (ready) return ready;
  ready = (async () => {
    let resp;
    try {
      resp = await fetch('/api/whoami', { credentials: 'same-origin' });
    } catch (e) {
      throw new B24Error('Сетевая ошибка при обращении к серверу приложения: ' + e.message, 'NETWORK', e);
    }
    const json = await resp.json().catch(() => ({}));
    if (!json.hasSession) {
      throw new B24Error('Сессия портала не получена. Откройте приложение внутри портала Битрикс24.', 'NO_SESSION');
    }
  })();
  return ready;
}

// --- Повторные попытки при сетевых сбоях ----------------------------------

function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

async function withRetry(fn) {
  const { attempts, backoffMs } = CONFIG.retry;
  let lastErr;
  for (let i = 0; i < attempts; i++) {
    try {
      return await fn();
    } catch (e) {
      lastErr = e;
      if (!isTransient(e) || i === attempts - 1) throw e;
      await sleep(backoffMs[Math.min(i, backoffMs.length - 1)]);
    }
  }
  throw lastErr;
}

function isTransient(e) {
  if (e instanceof B24Error) {
    if (e.code === 'NETWORK') return true;
    if (typeof e.code === 'number' && e.code >= 500) return true;
    if (e.code === 429 || e.code === 'QUERY_LIMIT_EXCEEDED' || e.code === 'OPERATION_TIME_LIMIT') return true;
    return false;
  }
  return true;
}

// --- Базовый запрос к BFF -------------------------------------------------

// Ответ vibecode: { success, data, total, meta } либо { success:false, error }.
async function request(path, { method = 'GET', query, body } = {}) {
  let url = CONFIG.apiBase + path;
  if (query) {
    const qs = new URLSearchParams(query).toString();
    if (qs) url += (path.includes('?') ? '&' : '?') + qs;
  }
  let resp;
  try {
    resp = await fetch(url, {
      method,
      headers: body !== undefined ? { 'Content-Type': 'application/json' } : undefined,
      body: body !== undefined ? JSON.stringify(body) : undefined,
      credentials: 'same-origin',
    });
  } catch (e) {
    throw new B24Error('Сетевая ошибка: ' + e.message, 'NETWORK', e);
  }
  let json;
  try { json = await resp.json(); } catch { json = null; }
  if (!resp.ok || (json && json.success === false)) {
    const err = (json && json.error) || {};
    throw new B24Error(err.message || ('HTTP ' + resp.status), err.code || resp.status, json);
  }
  return json || {};
}

// GET-запрос: возвращает массив data (списки) или объект data.
async function apiGet(path, query) {
  const json = await withRetry(() => request(path, { method: 'GET', query }));
  return json.data !== undefined ? json.data : json;
}

// POST/PATCH/DELETE с телом. Возвращает data.
async function apiSend(path, method, body) {
  const json = await withRetry(() => request(path, { method, body }));
  return json.data !== undefined ? json.data : json;
}

// --- Настройки (выбор сотрудников) ----------------------------------------
// Хранятся локально в браузере: токена для серверного хранилища у фронта нет,
// а выбор по умолчанию — это пользовательское предпочтение на рабочем месте.

async function getOption(key, fallback = null) {
  try {
    const v = localStorage.getItem(key);
    return v !== null && v !== '' ? v : fallback;
  } catch {
    return fallback;
  }
}

async function setOption(key, value) {
  try { localStorage.setItem(key, value); } catch (e) { /* приватный режим — игнорируем */ }
}



// ===== js/data.js =====
// Доменный слой: загрузка и сохранение сущностей Битрикс24 через BFF
// (REST vibecode), с приведением их к единой модели «item».
//
// Единая модель:
//   { id, kind: 'task'|'event'|'absence', userId,
//     title, description, start: Date, end: Date,
//     status, hoursFact, hoursPlan, hoursToday, allDay, raw }


function asArray(data) {
  if (Array.isArray(data)) return data;
  if (data && Array.isArray(data.items)) return data.items;
  if (data && Array.isArray(data.tasks)) return data.tasks;
  if (data && Array.isArray(data.events)) return data.events;
  return [];
}

// --- Сотрудники -----------------------------------------------------------

async function loadUsers() {
  // Без select — забираем полные записи (поля у vibecode в camelCase: id, name,
  // lastName, …). limit большой: vibecode пагинирует сам. Неактивных и
  // сортировку обрабатываем на клиенте.
  const rows = asArray(await apiGet('/users', { limit: 500 }));
  return rows
    .filter((u) => u && (u.id || u.ID) &&
      u.active !== false && u.ACTIVE !== false && u.ACTIVE !== 'N')
    .map((u) => ({
      id: String(u.id || u.ID),
      name: userName(u),
      position: u.workPosition || u.WORK_POSITION || u.position || '',
      photo: u.personalPhoto || u.PERSONAL_PHOTO || u.photo || '',
    }))
    .sort((a, b) => a.name.localeCompare(b.name, 'ru'));
}

// Собирает «Фамилия Имя» из любых доступных полей записи сотрудника.
function userName(u) {
  const last = u.lastName || u.LAST_NAME || '';
  const first = u.firstName || u.name || u.NAME || '';
  const combined = [last, first].filter(Boolean).join(' ').trim();
  return combined ||
    u.fullName || u.displayName || u.title ||
    u.email || u.EMAIL || ('ID ' + (u.id || u.ID));
}

// --- Загрузка данных недели ------------------------------------------------

const TASK_SELECT = [
  'id', 'title', 'status', 'responsibleId', 'description',
  'deadline', 'startDatePlan', 'endDatePlan',
  'timeEstimate', 'timeSpentInLogs',
];

// Загружает задачи, события и отсутствия для всех сотрудников за неделю.
// Возвращает Map<userId, item[]>.
async function loadWeekData(userIds, weekDate) {
  const range = weekRangeB24(weekDate);
  const byUser = new Map(userIds.map((id) => [String(id), []]));

  await Promise.all(userIds.map(async (id) => {
    const sid = String(id);
    const items = byUser.get(sid);

    const [planTasks, dlTasks, events] = await Promise.all([
      searchTasks({ responsibleId: id, '>=startDatePlan': range.from, '<=startDatePlan': range.to }),
      searchTasks({ responsibleId: id, '>=deadline': range.from, '<=deadline': range.to }),
      loadUserEvents(id, range),
    ]);

    // Задачи: объединяем два набора и убираем дубли по id.
    const taskMap = new Map();
    for (const t of [...planTasks, ...dlTasks]) {
      const tid = t.id != null ? t.id : t.ID;
      if (tid != null) taskMap.set(String(tid), t);
    }
    for (const t of taskMap.values()) {
      const item = mapTask(t, sid);
      if (item) items.push(item);
    }

    for (const e of events) {
      const item = mapEvent(e, sid);
      if (item) items.push(item);
    }
  }));

  // Локальные размещения задач (планирование) — поверх данных из Битрикс24.
  for (const id of userIds) {
    const items = byUser.get(String(id));
    for (const p of placementItems(id)) items.push(p);
  }

  await enrichTodayLogged(byUser);
  return byUser;
}

async function searchTasks(filter) {
  try {
    const data = await apiSend('/tasks/search', 'POST', {
      filter, select: TASK_SELECT, limit: 200,
    });
    return asArray(data);
  } catch (e) {
    console.warn('Не удалось загрузить задачи:', e);
    return [];
  }
}

async function loadUserEvents(id, range) {
  try {
    const data = await apiGet('/calendar-events', {
      type: 'user', ownerId: id, from: range.from, to: range.to,
    });
    return asArray(data);
  } catch (e) {
    console.warn('Не удалось загрузить события календаря:', e);
    return [];
  }
}

function mapTask(t, userId) {
  const title = t.title || t.TITLE || 'Без названия';
  const planStart = parseB24Date(t.startDatePlan || t.START_DATE_PLAN);
  const planEnd = parseB24Date(t.endDatePlan || t.END_DATE_PLAN);
  const deadline = parseB24Date(t.deadline || t.DEADLINE);

  let start, end;
  if (planStart && planEnd && planEnd > planStart) {
    start = planStart;
    end = planEnd;
  } else if (deadline) {
    end = deadline;
    start = new Date(deadline.getTime() - GRID.slotMinutes * 60 * 1000);
  } else {
    return null;
  }

  const code = toStatusCode(t.status != null ? t.status : t.STATUS);
  const status = resolveTaskStatus(code, deadline);
  const timeEstimate = Number(t.timeEstimate || t.TIME_ESTIMATE || 0);
  const timeSpent = Number(t.timeSpentInLogs || t.TIME_SPENT_IN_LOGS || 0);

  return {
    id: 'task_' + (t.id || t.ID),
    rawId: String(t.id || t.ID),
    kind: 'task',
    userId,
    title,
    description: t.description || t.DESCRIPTION || '',
    start, end,
    allDay: false,
    status,
    hoursPlan: secondsToHours(timeEstimate),
    hoursFact: secondsToHours(timeSpent),
    hoursToday: 0,
    raw: t,
  };
}

// Статус приходит числом (1..7) либо строкой-перечислением — нормализуем.
const STATUS_STRING_TO_CODE = {
  pending: 2, new: 2,
  inprogress: 3, in_progress: 3,
  supposedlycompleted: 4, almostdone: 4,
  completed: 5, complete: 5, done: 5,
  deferred: 6, paused: 6,
  declined: 7,
};

function toStatusCode(raw) {
  if (raw == null) return NaN;
  if (typeof raw === 'number') return raw;
  const n = Number(raw);
  if (!Number.isNaN(n)) return n;
  return STATUS_STRING_TO_CODE[String(raw).toLowerCase().replace(/[\s-]/g, '_')] ||
         STATUS_STRING_TO_CODE[String(raw).toLowerCase().replace(/[\s_-]/g, '')] || NaN;
}

function resolveTaskStatus(code, deadline) {
  const completed = code === 5 || code === 4;
  if (!completed && deadline && deadline < new Date()) return TASK_STATUS.overdue;
  switch (code) {
    case 3: return TASK_STATUS.inProgress;
    case 6: return TASK_STATUS.deferred;
    case 4:
    case 5: return TASK_STATUS.completed;
    default: return TASK_STATUS.pending;
  }
}

function mapEvent(e, userId) {
  const start = parseB24Date(e.dateFrom || e.DATE_FROM || e.from);
  const end = parseB24Date(e.dateTo || e.DATE_TO || e.to);
  if (!start || !end) return null;

  const accessibility = String(e.accessibility || e.ACCESSIBILITY || '').toLowerCase();
  const isAbsence = accessibility === 'absent';
  const skipTime = (e.skipTime || e.SKIP_TIME) === 'Y' || e.skipTime === true;

  return {
    id: (isAbsence ? 'absence_' : 'event_') + (e.id || e.ID),
    rawId: String(e.id || e.ID),
    kind: isAbsence ? 'absence' : 'event',
    userId,
    title: e.name || e.NAME || (isAbsence ? 'Отсутствие' : 'Событие'),
    description: e.description || e.DESCRIPTION || '',
    start, end,
    allDay: skipTime,
    status: null,
    hoursPlan: 0, hoursFact: 0, hoursToday: 0,
    raw: e,
  };
}

// Заполняет hoursToday для задач (время, залогированное сегодня). Best-effort.
async function enrichTodayLogged(byUser) {
  const todayStart = startOfDay(new Date());
  const todayEnd = addDays(todayStart, 1);

  const taskItems = [];
  for (const items of byUser.values()) {
    for (const it of items) if (it.kind === 'task') taskItems.push(it);
  }
  if (taskItems.length === 0) return;

  await Promise.all(taskItems.map(async (it) => {
    try {
      const rows = asArray(await apiGet('/tasks/' + it.rawId + '/time'));
      let sec = 0;
      for (const r of rows) {
        const created = parseB24Date(r.createdDate || r.CREATED_DATE || r.createdAt);
        if (created && created >= todayStart && created < todayEnd) {
          sec += Number(r.seconds || r.SECONDS || 0);
        }
      }
      it.hoursToday = secondsToHours(sec);
    } catch (e) { /* не критично — оставим 0 */ }
  }));
}

// --- Создание и обновление сущностей --------------------------------------

async function createTask({ title, userId, description, start, end, hoursPlan }) {
  const body = { title, responsibleId: userId, description: description || '' };
  if (start) body.startDatePlan = toB24DateTime(start);
  if (end) {
    body.endDatePlan = toB24DateTime(end);
    body.deadline = toB24DateTime(end);
  }
  if (hoursPlan) body.timeEstimate = Math.round(Number(hoursPlan) * 3600);
  return apiSend('/tasks', 'POST', body);
}

async function updateTask(rawId, { title, description, start, end, hoursPlan, status }) {
  const body = {};
  if (title != null) body.title = title;
  if (description != null) body.description = description;
  if (start) body.startDatePlan = toB24DateTime(start);
  if (end) {
    body.endDatePlan = toB24DateTime(end);
    body.deadline = toB24DateTime(end);
  }
  if (hoursPlan != null && hoursPlan !== '') body.timeEstimate = Math.round(Number(hoursPlan) * 3600);
  if (status != null) body.status = status;
  return apiSend('/tasks/' + rawId, 'PATCH', body);
}

// --- Локальные «размещения» задач на сетке (планирование) -----------------
// Размещение задачи в ячейке НЕ меняет саму задачу в Битрикс24: ни плановые
// даты, ни дедлайн, ни учёт времени. Одну задачу можно положить в несколько
// слотов параллельно. Хранится локально в браузере.

const PLACEMENTS_KEY = 'planner_task_placements';

function readPlacements() {
  try {
    const arr = JSON.parse(localStorage.getItem(PLACEMENTS_KEY) || '[]');
    return Array.isArray(arr) ? arr : [];
  } catch { return []; }
}

function writePlacements(arr) {
  try { localStorage.setItem(PLACEMENTS_KEY, JSON.stringify(arr)); } catch (e) { /* приватный режим */ }
}

function addPlacement({ taskId, title, userId, start, end }) {
  const arr = readPlacements();
  arr.push({
    id: 'pl_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    taskId: String(taskId),
    title: title || 'Задача',
    userId: String(userId),
    start: start.toISOString(),
    end: end.toISOString(),
  });
  writePlacements(arr);
}

function updatePlacement(id, { start, end }) {
  const arr = readPlacements();
  const p = arr.find((x) => x.id === id);
  if (!p) return;
  if (start) p.start = start.toISOString();
  if (end) p.end = end.toISOString();
  writePlacements(arr);
}

function removePlacement(id) {
  writePlacements(readPlacements().filter((x) => x.id !== id));
}

// Размещения сотрудника в виде item-ов для рендера календаря.
function placementItems(userId) {
  return readPlacements()
    .filter((p) => String(p.userId) === String(userId))
    .map((p) => ({
      id: 'place_' + p.id,
      localId: p.id,
      kind: 'placement',
      userId: String(p.userId),
      taskId: p.taskId,
      title: p.title,
      description: '',
      start: new Date(p.start),
      end: new Date(p.end),
      allDay: false,
      status: null,
      hoursPlan: 0, hoursFact: 0, hoursToday: 0,
      raw: p,
    }));
}

// Список задач сотрудника для привязки (активные, не завершённые).
async function loadUserTasksForPick(userId) {
  const data = await apiSend('/tasks/search', 'POST', {
    filter: { responsibleId: userId },
    select: ['id', 'title', 'status', 'deadline'],
    order: { id: 'desc' },
    limit: 200,
  });
  return asArray(data)
    .filter((t) => {
      const code = toStatusCode(t.status != null ? t.status : t.STATUS);
      return Number.isNaN(code) || code < 5; // прячем завершённые, если статус понятен
    })
    .map((t) => ({
      id: String(t.id || t.ID),
      title: t.title || t.TITLE || 'Без названия',
    }));
}

async function createEvent({ name, userId, description, start, end, kind }) {
  // Обёртка вызывает calendar.event.add — ему обязательны from/to (а не
  // dateFrom/dateTo). Шлём оба варианта для совместимости.
  const from = toB24DateTime(start);
  const to = toB24DateTime(end);
  return apiSend('/calendar-events', 'POST', {
    type: 'user',
    ownerId: userId,
    name,
    description: description || '',
    from, to, dateFrom: from, dateTo: to,
    accessibility: kind === 'absence' ? 'absent' : 'busy',
  });
}

async function updateEvent(rawId, userId, { name, description, start, end, kind }) {
  const body = { type: 'user', ownerId: userId };
  if (name != null) body.name = name;
  if (description != null) body.description = description;
  if (start) { const f = toB24DateTime(start); body.from = f; body.dateFrom = f; }
  if (end) { const t = toB24DateTime(end); body.to = t; body.dateTo = t; }
  if (kind) body.accessibility = kind === 'absence' ? 'absent' : 'busy';
  return apiSend('/calendar-events/' + rawId, 'PATCH', body);
}



// ===== js/ui/toast.js =====
// Всплывающие уведомления (понятные сообщения об ошибках/успехе).

let container;

function ensureContainer() {
  if (!container) {
    container = document.createElement('div');
    container.className = 'toast-container';
    document.body.appendChild(container);
  }
  return container;
}

function showToast(message, type = 'info', timeout = 4000) {
  const el = document.createElement('div');
  el.className = `toast toast--${type}`;
  el.textContent = message;
  ensureContainer().appendChild(el);
  // запуск анимации появления
  requestAnimationFrame(() => el.classList.add('toast--visible'));
  const remove = () => {
    el.classList.remove('toast--visible');
    setTimeout(() => el.remove(), 250);
  };
  el.addEventListener('click', remove);
  if (timeout) setTimeout(remove, timeout);
}

function showError(err) {
  const msg = err && err.message ? err.message : String(err);
  showToast(msg, 'error', 6000);
}


// ===== js/ui/tooltip.js =====
// Единый тултип с полной информацией о ячейке, следующий за курсором.


let tip;

function ensure() {
  if (!tip) {
    tip = document.createElement('div');
    tip.className = 'tooltip';
    document.body.appendChild(tip);
  }
  return tip;
}

function buildHtml(item) {
  const rows = [];
  rows.push(`<div class="tooltip__title">${escapeHtml(item.title)}</div>`);

  const kindLabel = { task: 'Задача', event: 'Встреча/событие', absence: 'Отсутствие', placement: 'Задача (планирование)' }[item.kind];
  rows.push(`<div class="tooltip__row"><b>Тип:</b> ${kindLabel}</div>`);

  const timeStr = item.allDay
    ? 'весь день'
    : `${formatTime(item.start)}–${formatTime(item.end)}`;
  rows.push(`<div class="tooltip__row"><b>Время:</b> ${timeStr}</div>`);

  if (item.kind === 'task') {
    rows.push(`<div class="tooltip__row"><b>Часы:</b> ` +
      `план ${item.hoursPlan}, факт ${item.hoursFact}, сегодня ${item.hoursToday}</div>`);
    if (item.status) {
      rows.push(`<div class="tooltip__row"><b>Статус:</b> ${item.status.icon} ${item.status.label}</div>`);
    }
  }
  if (item.description) {
    rows.push(`<div class="tooltip__row tooltip__desc">${escapeHtml(stripHtml(item.description)).slice(0, 280)}</div>`);
  }
  return rows.join('');
}

function showTooltip(item, x, y) {
  const el = ensure();
  el.innerHTML = buildHtml(item);
  el.classList.add('tooltip--visible');
  moveTooltip(x, y);
}

function moveTooltip(x, y) {
  if (!tip) return;
  const pad = 14;
  const rect = tip.getBoundingClientRect();
  let left = x + pad;
  let top = y + pad;
  if (left + rect.width > window.innerWidth) left = x - rect.width - pad;
  if (top + rect.height > window.innerHeight) top = y - rect.height - pad;
  tip.style.left = Math.max(4, left) + 'px';
  tip.style.top = Math.max(4, top) + 'px';
}

function hideTooltip() {
  if (tip) tip.classList.remove('tooltip--visible');
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
function stripHtml(s) {
  return String(s).replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
}


// ===== js/ui/modals.js =====
// Попапы: меню слота, формы создания/редактирования задач, встреч и отсутствий,
// выбор существующей задачи для привязки к слоту.


// --- Базовый модальный каркас ---------------------------------------------

function openModal({ title, bodyEl, width = 420 }) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';

  const dialog = document.createElement('div');
  dialog.className = 'modal';
  dialog.style.maxWidth = width + 'px';

  const head = document.createElement('div');
  head.className = 'modal__head';
  head.innerHTML = `<div class="modal__title">${escapeHtml(title)}</div>`;
  const close = document.createElement('button');
  close.className = 'modal__close';
  close.textContent = '×';
  close.addEventListener('click', () => destroy());
  head.appendChild(close);

  dialog.appendChild(head);
  dialog.appendChild(bodyEl);
  overlay.appendChild(dialog);
  document.body.appendChild(overlay);

  const onKey = (e) => { if (e.key === 'Escape') destroy(); };
  overlay.addEventListener('click', (e) => { if (e.target === overlay) destroy(); });
  document.addEventListener('keydown', onKey);

  function destroy() {
    document.removeEventListener('keydown', onKey);
    overlay.remove();
  }
  return { overlay, destroy };
}

// --- Меню при клике по пустому слоту --------------------------------------

function openSlotMenu({ user, start, end }) {
  const body = document.createElement('div');
  body.className = 'modal__body slot-menu';

  const hint = document.createElement('div');
  hint.className = 'slot-menu__hint';
  hint.textContent = `${user.name} · ${formatDayLabel(start)} · ${formatTime(start)}–${formatTime(end)}`;
  body.appendChild(hint);

  const actions = [
    ['＋ Создать задачу', () => { modal.destroy(); openTaskForm({ mode: 'create', user, start, end }); }],
    ['📋 Выбрать задачу из существующих', () => { modal.destroy(); openPickTask({ user, start, end }); }],
    ['📅 Создать встречу', () => { modal.destroy(); openEventForm({ mode: 'create', kind: 'event', user, start, end }); }],
    ['🌴 Добавить отсутствие', () => { modal.destroy(); openEventForm({ mode: 'create', kind: 'absence', user, start, end }); }],
  ];
  for (const [label, fn] of actions) {
    const btn = document.createElement('button');
    btn.className = 'slot-menu__item';
    btn.textContent = label;
    btn.addEventListener('click', fn);
    body.appendChild(btn);
  }

  const modal = openModal({ title: 'Что создать?', bodyEl: body, width: 360 });
}

// --- Выбор существующей задачи --------------------------------------------

async function openPickTask({ user, start, end }) {
  const body = document.createElement('div');
  body.className = 'modal__body';
  body.innerHTML = '<div class="form__loading">Загрузка задач…</div>';
  const modal = openModal({ title: 'Задача в планирование', bodyEl: body, width: 460 });

  let tasks;
  try {
    tasks = await loadUserTasksForPick(user.id);
  } catch (e) { showError(e); modal.destroy(); return; }

  body.innerHTML = '';
  if (tasks.length === 0) {
    body.innerHTML = '<div class="form__loading">У сотрудника нет активных задач.</div>';
    return;
  }
  body.appendChild(metaLine('Задача ляжет в выбранный слот только для планирования — ' +
    'сама задача в Битрикс24 (сроки, учёт времени) не меняется. Одну задачу можно ' +
    'разместить в нескольких слотах.'));
  const search = inputRow('Поиск', 'text', '');
  body.appendChild(search.row);

  const list = document.createElement('div');
  list.className = 'pick-list';
  body.appendChild(list);

  const render = (q) => {
    list.innerHTML = '';
    const filtered = tasks.filter((t) => t.title.toLowerCase().includes(q.toLowerCase()));
    for (const t of filtered) {
      const item = document.createElement('button');
      item.className = 'pick-list__item';
      item.textContent = t.title;
      item.addEventListener('click', async () => {
        try {
          addPlacement({ taskId: t.id, title: t.title, userId: user.id, start, end });
          showToast('Задача добавлена в планирование', 'success');
          modal.destroy();
          await bus.reloadWeek();
        } catch (e) { showError(e); }
      });
      list.appendChild(item);
    }
  };
  search.input.addEventListener('input', () => render(search.input.value));
  render('');
}

// --- Форма задачи (создание/редактирование) -------------------------------

function openTaskForm({ mode, user, start, end, item }) {
  const body = document.createElement('div');
  body.className = 'modal__body';

  const isEdit = mode === 'edit';
  const u = user || selectedUsers().find((x) => x.id === item.userId) || { id: item && item.userId, name: '' };

  const fTitle = inputRow('Название задачи *', 'text', isEdit ? item.title : '');
  const fStart = inputRow('Начало', 'datetime-local', toDateTimeInputValue(isEdit ? item.start : start));
  const fEnd = inputRow('Окончание', 'datetime-local', toDateTimeInputValue(isEdit ? item.end : end));
  const fHours = inputRow('Плановые часы', 'number', isEdit ? item.hoursPlan : '');
  fHours.input.step = '0.5'; fHours.input.min = '0';
  const fDesc = textareaRow('Описание', isEdit ? stripHtml(item.description) : '');

  body.appendChild(metaLine(`Сотрудник: ${u.name || ('ID ' + u.id)}`));
  body.appendChild(fTitle.row);
  body.appendChild(fStart.row);
  body.appendChild(fEnd.row);
  body.appendChild(fHours.row);

  let fStatus;
  if (isEdit) {
    fStatus = selectRow('Статус', statusOptions(), String(item.status ? item.status.code : 2));
    body.appendChild(fStatus.row);
  }
  body.appendChild(fDesc.row);

  const modal = openModal({ title: isEdit ? 'Редактирование задачи' : 'Создать задачу', bodyEl: body });
  addFooter(body, modal, async () => {
    const payload = {
      title: fTitle.input.value.trim(),
      description: fDesc.input.value,
      start: new Date(fStart.input.value),
      end: new Date(fEnd.input.value),
      hoursPlan: fHours.input.value,
    };
    if (!payload.title) throw new Error('Укажите название задачи');
    if (!(payload.end > payload.start)) throw new Error('Окончание должно быть позже начала');

    if (isEdit) {
      await updateTask(item.rawId, { ...payload, status: fStatus ? Number(fStatus.input.value) : undefined });
      showToast('Задача обновлена', 'success');
    } else {
      await createTask({ ...payload, userId: u.id });
      showToast('Задача создана', 'success');
    }
  });
}

function statusOptions() {
  return [
    [String(TASK_STATUS.pending.code), TASK_STATUS.pending.label],
    [String(TASK_STATUS.inProgress.code), TASK_STATUS.inProgress.label],
    [String(TASK_STATUS.deferred.code), TASK_STATUS.deferred.label],
    [String(TASK_STATUS.completed.code), TASK_STATUS.completed.label],
  ];
}

function openEventForm({ mode, kind, user, start, end, item }) {

  body.className = 'modal__body';

  const isEdit = mode === 'edit';
  const initialKind = isEdit ? item.kind : (kind || 'event');
  const u = user || selectedUsers().find((x) => x.id === item.userId) || { id: item && item.userId, name: '' };

  const fStart = inputRow('Начало', 'datetime-local', toDateTimeInputValue(isEdit ? item.start : start));
  const fEnd = inputRow('Окончание', 'datetime-local', toDateTimeInputValue(isEdit ? item.end : end));
  const fDesc = textareaRow('Описание', isEdit ? stripHtml(item.description) : '');

  body.appendChild(metaLine(`Сотрудник: ${u.name || ('ID ' + u.id)}`));
  body.appendChild(fKind.row);
  body.appendChild(fName.row);
  body.appendChild(fStart.row);
  body.appendChild(fEnd.row);
  body.appendChild(fDesc.row);

  const modal = openModal({ title: isEdit ? 'Редактирование события' : 'Создать событие', bodyEl: body });

      showToast('Событие обновлено', 'success');
    } else {
      await createEvent({ name, userId: u.id, description: fDesc.input.value, start: s, end: e, kind: kindVal });
      showToast(kindVal === 'absence' ? 'Отсутствие добавлено' : 'Встреча создана', 'success');

function selectRow(label, options, value) {
  const row = document.createElement('label');
  row.className = 'form__row';
  const span = document.createElement('span');
  span.className = 'form__label';
  span.textContent = label;

function escapeHtml(s) {

}
function stripHtml(s) {
  return String(s || '').replace(/<br\s*\/?>(?=)/gi, '\n').replace(/<[^>]*>/g, '').trim();
}


// ===== js/ui/calendar.js =====
// Рендер недельной сетки календаря: дни ПН–ПТ, временная шкала 8:00–18:00,
// шаг 30 минут, многоколоночная разбивка по сотрудникам.


const SLOTS_PER_DAY = (GRID.workEndHour - GRID.workStartHour) * (60 / GRID.slotMinutes); // 20
const BODY_HEIGHT = SLOTS_PER_DAY * GRID.slotHeightPx; // 1000px

function renderCalendar(root) {
  root.innerHTML = '';

  const users = selectedUsers();
  if (users.length === 0) {
    root.appendChild(emptyHint());
    return;
  }

  const days = weekDays(state.currentWeek);

  const scrollY = el('div', 'cal-scroll-y');
  const grid = el('div', 'cal-grid');
  grid.appendChild(buildTimeColumn());
  for (const day of days) {
    grid.appendChild(buildDayColumn(day, users));
  }
  scrollY.appendChild(grid);
  root.appendChild(scrollY);
}

function emptyHint() {
  const box = el('div', 'cal-empty');
  box.innerHTML =
    '<div class="cal-empty__icon">📅</div>' +
    '<div class="cal-empty__text">Выберите сотрудников для отображения</div>' +
    '<div class="cal-empty__hint">До 5 сотрудников — через список в шапке или настройки (⚙).</div>';
  return box;
}

// --- Колонка временной шкалы ----------------------------------------------

function buildTimeColumn() {
  const col = el('div', 'cal-time');
  const header = el('div', 'cal-time__header');
  col.appendChild(header);

  const body = el('div', 'cal-time__body');
  body.style.height = BODY_HEIGHT + 'px';
  for (let i = 0; i < SLOTS_PER_DAY; i++) {
    const label = el('div', 'cal-time__slot');
    label.style.height = GRID.slotHeightPx + 'px';
    const minutes = i * GRID.slotMinutes;
    if (minutes % 60 === 0) {
      const hour = GRID.workStartHour + minutes / 60;
      label.textContent = String(hour).padStart(2, '0') + ':00';
      label.classList.add('cal-time__slot--hour');
    }
    body.appendChild(label);
  }
  col.appendChild(body);
  return col;
}

// --- Колонка дня ----------------------------------------------------------

function buildDayColumn(day, users) {
  const col = el('div', 'cal-day');
  if (isToday(day)) col.classList.add('cal-day--today');

  const header = el('div', 'cal-day__header');
  header.textContent = formatDayLabel(day);
  col.appendChild(header);

  // Минимальная ширина подколонки сотрудника. При 3+ сотрудниках появляется
  // горизонтальный скролл всей сетки (за счёт суммарной ширины).
  const subWidth = users.length >= 3 ? 140 : 0;

  const subHeader = el('div', 'cal-day__sub');
  for (const u of users) {
    const cell = el('div', 'cal-day__sub-cell');
    if (subWidth) cell.style.minWidth = subWidth + 'px';
    cell.title = u.name + (u.position ? ' — ' + u.position : '');
    cell.textContent = shortName(u.name);
    subHeader.appendChild(cell);
  }
  col.appendChild(subHeader);

  const body = el('div', 'cal-day__body');
  for (const u of users) {
    body.appendChild(buildSubColumn(day, u, subWidth));
  }
  col.appendChild(body);
  return col;
}

function buildSubColumn(day, user, minColWidth) {
  const sub = el('div', 'cal-subcol');
  sub.style.height = BODY_HEIGHT + 'px';
  if (minColWidth) sub.style.minWidth = minColWidth + 'px';

  // Фоновые 30-минутные слоты (кликабельны для создания).
  for (let i = 0; i < SLOTS_PER_DAY; i++) {
    const slot = el('div', 'cal-slot');
    slot.style.height = GRID.slotHeightPx + 'px';
    if (i % 2 === 1) slot.classList.add('cal-slot--half');
    slot.addEventListener('click', () => {
      const start = slotTime(day, i);
      const end = slotTime(day, i + 1);
      openSlotMenu({ user, start, end });
    });
    sub.appendChild(slot);
  }

  // Блоки сущностей поверх слотов.
  const items = itemsFor(user.id);
  const dayItems = items
    .map((it) => geometryFor(it, day))
    .filter(Boolean);
  layoutLanes(dayItems);
  for (const g of dayItems) {
    sub.appendChild(buildBlock(g, day));
  }
  return sub;
}

// --- Геометрия блока на сетке дня ------------------------------------------

function geometryFor(item, day) {
  const dayStart = startOfDay(day);
  const nextDay = addDays(dayStart, 1);
  // Пересекает ли этот день вообще?
  if (item.end <= dayStart || item.start >= nextDay) return null;

  const gridTop = new Date(dayStart); gridTop.setHours(GRID.workStartHour, 0, 0, 0);
  const gridBottom = new Date(dayStart); gridBottom.setHours(GRID.workEndHour, 0, 0, 0);

  const continuesBefore = item.start < gridTop;
  const continuesAfter = item.end > gridBottom;

  let clampStart = item.start < gridTop ? gridTop : item.start;
  let clampEnd = item.end > gridBottom ? gridBottom : item.end;

  let top, height, outOfGrid = false;
  if (item.allDay) {
    top = 0; height = BODY_HEIGHT;
  } else if (clampEnd <= clampStart) {
    // Полностью вне рабочих часов, но внутри дня — прижимаем к краю.
    outOfGrid = true;
    if (item.end <= gridTop) { top = 0; height = 18; }
    else { top = BODY_HEIGHT - 18; height = 18; }
  } else {
    top = (minutesFromGridStart(clampStart) / GRID.slotMinutes) * GRID.slotHeightPx;
    const endMin = (clampEnd - gridTop) / 60000;
    height = (endMin / GRID.slotMinutes) * GRID.slotHeightPx - top;
    height = Math.max(height, 22); // минимально видимая высота
  }

  return {
    item, top, height,
    continuesBefore, continuesAfter, outOfGrid,
    lane: 0, lanes: 1,
  };
}

// Простейшая раскладка пересекающихся блоков по «дорожкам».
function layoutLanes(geoms) {
  const sorted = [...geoms].sort((a, b) => a.top - b.top || a.item.start - b.item.start);
  const active = []; // {endPx, lane}
  let cluster = [];
  let clusterEnd = -Infinity;

  const flush = () => {
    const lanes = Math.max(1, new Set(cluster.map((g) => g.lane)).size);
    for (const g of cluster) g.lanes = lanes;
    cluster = [];
  };

  for (const g of sorted) {
    if (g.top >= clusterEnd) { flush(); active.length = 0; }
    // найти свободную дорожку
    let lane = 0;
    while (active.some((a) => a.lane === lane && a.endPx > g.top)) lane++;
    g.lane = lane;
    active.push({ lane, endPx: g.top + g.height });
    clusterEnd = Math.max(clusterEnd, g.top + g.height);
    cluster.push(g);
  }
  flush();
}

// --- DOM блока ------------------------------------------------------------

function buildBlock(g, day) {
  const { item } = g;
  const block = el('div', `cal-block cal-block--${item.kind}`);
  const colors = COLORS[item.kind];
  block.style.top = g.top + 'px';
  block.style.height = g.height + 'px';
  block.style.left = `calc(${(g.lane / g.lanes) * 100}% + 2px)`;
  block.style.width = `calc(${100 / g.lanes}% - 4px)`;
  block.style.background = colors.bg;
  block.style.borderColor = colors.border;
  if (g.outOfGrid) block.classList.add('cal-block--edge');

  // Маркеры выхода за пределы сетки (для событий с конкретным временем).
  if (!item.allDay && g.continuesBefore) block.appendChild(edgeMark('top', '↑ до сетки'));
  if (!item.allDay && g.continuesAfter) block.appendChild(edgeMark('bottom', '↓ за сеткой'));

  const content = el('div', 'cal-block__content');
  const title = el('div', 'cal-block__title');
  title.textContent = item.title;
  content.appendChild(title);

  if (item.kind === 'task') {
    const meta = el('div', 'cal-block__meta');
    meta.innerHTML =
      `<span class="cal-block__status" title="${item.status.label}">${item.status.icon}</span>` +
      `<span class="cal-block__hours">ф:${item.hoursFact}/п:${item.hoursPlan}/с:${item.hoursToday}</span>`;
    content.appendChild(meta);
  } else {
    const meta = el('div', 'cal-block__meta');
    meta.textContent = item.allDay ? 'весь день' : `${formatTime(item.start)}–${formatTime(item.end)}`;
    content.appendChild(meta);
  }
  block.appendChild(content);

  // Карандаш редактирования при наведении.
  const pencil = el('button', 'cal-block__edit');
  pencil.textContent = '✎';
  pencil.title = 'Редактировать';
  pencil.addEventListener('click', (e) => { e.stopPropagation(); openEditModal(item); });
  block.appendChild(pencil);

  // Ручки изменения длительности по краям — для планируемых задач и событий.
  // Тянем границу мышью, попап редактирования при этом не открывается.
  const resizable = !item.allDay && !g.outOfGrid &&
    (item.kind === 'placement' || item.kind === 'event' || item.kind === 'absence');
  if (resizable) {
    block.appendChild(buildResizeHandle('top', g, day, item, block));
    block.appendChild(buildResizeHandle('bottom', g, day, item, block));
  }

  // Взаимодействие.
  block.addEventListener('dblclick', (e) => { e.stopPropagation(); openEditModal(item); });
  block.addEventListener('mouseenter', (e) => showTooltip(item, e.clientX, e.clientY));
  block.addEventListener('mousemove', (e) => moveTooltip(e.clientX, e.clientY));
  block.addEventListener('mouseleave', hideTooltip);

  return block;
}

// --- Изменение длительности перетаскиванием края ---------------------------

function buildResizeHandle(edge, g, day, item, block) {
  const handle = el('div', `cal-block__resize cal-block__resize--${edge}`);
  handle.addEventListener('mousedown', (e) => {
    e.preventDefault();
    e.stopPropagation();
    hideTooltip();
    startResize(edge, g, day, item, block, e.clientY);
  });
  // Гасим клики/двойные клики на ручке, чтобы не открыть попап.
  handle.addEventListener('click', (e) => e.stopPropagation());
  handle.addEventListener('dblclick', (e) => e.stopPropagation());
  return handle;
}

function startResize(edge, g, day, item, block, startY) {
  const origTop = g.top;
  const origHeight = g.height;
  const minPx = GRID.slotHeightPx; // минимум 30 минут
  let curTop = origTop;
  let curHeight = origHeight;

  const onMove = (ev) => {
    const dy = ev.clientY - startY;
    if (edge === 'top') {
      let top = origTop + dy;
      top = Math.max(0, Math.min(top, origTop + origHeight - minPx));
      curTop = top;
      curHeight = origTop + origHeight - top;
    } else {
      let height = origHeight + dy;
      height = Math.max(minPx, Math.min(height, BODY_HEIGHT - origTop));
      curHeight = height;
    }
    block.style.top = curTop + 'px';
    block.style.height = curHeight + 'px';
  };

  const onUp = async () => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.body.classList.remove('is-resizing');

    // Привязка к 30-минутной сетке.
    const snap = (px) => Math.round(px / GRID.slotHeightPx) * GRID.slotHeightPx;
    let top = snap(curTop);
    let height = Math.max(GRID.slotHeightPx, snap(curHeight));
    if (top + height > BODY_HEIGHT) height = BODY_HEIGHT - top;

    const { start, end } = pxToTimes(day, top, height);
    if (!(end > start)) { bus.reloadWeek(); return; }
    try {
      if (item.kind === 'placement') {
        updatePlacement(item.localId, { start, end });
      } else {
        await updateEvent(item.rawId, item.userId, { start, end, kind: item.kind });
      }
    } catch (e) {
      showError(e);
    }
    await bus.reloadWeek();
  };

  document.body.classList.add('is-resizing');
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

// Переводит вертикальную геометрию (px) в интервал времени дня.
function pxToTimes(day, topPx, heightPx) {
  const gridTop = startOfDay(day);
  gridTop.setHours(GRID.workStartHour, 0, 0, 0);
  const startMin = (topPx / GRID.slotHeightPx) * GRID.slotMinutes;
  const durMin = (heightPx / GRID.slotHeightPx) * GRID.slotMinutes;
  const start = new Date(gridTop.getTime() + startMin * 60000);
  const end = new Date(start.getTime() + durMin * 60000);
  return { start, end };
}

function edgeMark(pos, text) {
  const m = el('div', `cal-block__edge cal-block__edge--${pos}`);
  m.textContent = text;
  return m;
}

// --- Вспомогательное ------------------------------------------------------

function slotTime(day, slotIndex) {
  const d = startOfDay(day);
  const minutes = GRID.workStartHour * 60 + slotIndex * GRID.slotMinutes;
  d.setMinutes(minutes);
  return d;
}

function shortName(name) {
  const parts = String(name).split(' ');
  if (parts.length >= 2) return `${parts[0]} ${parts[1][0]}.`;
  return name;
}

function el(tag, className) {
  const e = document.createElement(tag);
  if (className) e.className = className;
  return e;
}


// ===== js/ui/employees.js =====
// Мультиселект сотрудников в шапке (до 5) и попап настроек (шестерёнка).
// Выбор сохраняется в настройках приложения Битрикс24 и применяется сразу.


let headerButton = null; // ссылка на кнопку шапки для обновления подписи

async function applySelection(ids) {
  setSelectedUserIds(ids);
  if (headerButton) refreshLabel(headerButton);
  emit(); // мгновенно перерисовать колонки/шапку
  try {
    await saveSelectedUserIds(state.selectedUserIds);
  } catch (e) {
    showError(e);
  }
  await bus.reloadWeek();
}

// --- Выпадающий мультиселект в шапке --------------------------------------

function renderHeaderPicker(container) {
  container.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'emp-picker';

  const button = document.createElement('button');
  button.className = 'emp-picker__button';
  headerButton = button;
  button.appendChild(labelSpan());
  button.insertAdjacentHTML('beforeend', '<span class="emp-picker__caret">▾</span>');
  wrap.appendChild(button);

  const panel = buildCheckboxPanel({
    getSelected: () => new Set(state.selectedUserIds),
    onChange: (ids) => { applySelection(ids); refreshLabel(button); },
  });
  panel.classList.add('emp-picker__panel');
  panel.style.display = 'none';
  wrap.appendChild(panel);

  button.addEventListener('click', (e) => {
    e.stopPropagation();
    const open = panel.style.display === 'none';
    panel.style.display = open ? 'block' : 'none';
    if (open) panel.refresh();
  });
  document.addEventListener('click', (e) => {
    if (!wrap.contains(e.target)) panel.style.display = 'none';
  });

  container.appendChild(wrap);
  refreshLabel(button);
}

function labelSpan() {
  const s = document.createElement('span');
  s.className = 'emp-picker__label';
  return s;
}

function refreshLabel(button) {
  const span = button.querySelector('.emp-picker__label');
  const ids = state.selectedUserIds;
  if (ids.length === 0) {
    span.textContent = 'Выберите сотрудников';
    return;
  }
  const byId = new Map(state.allUsers.map((u) => [u.id, u]));
  const names = ids.map((id) => (byId.get(id) || {}).name || ('ID ' + id));
  span.textContent = `${names.length} выбрано: ${names.map(short).join(', ')}`;
}

function short(name) {
  const p = String(name).split(' ');
  return p.length >= 2 ? `${p[0]} ${p[1][0]}.` : name;
}

// --- Настройки (шестерёнка) -----------------------------------------------

function openSettings() {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const dialog = document.createElement('div');
  dialog.className = 'modal';
  dialog.style.maxWidth = '460px';
  dialog.innerHTML =
    '<div class="modal__head"><div class="modal__title">Настройки</div>' +
    '<button class="modal__close">×</button></div>';

  const bodyWrap = document.createElement('div');
  bodyWrap.className = 'modal__body';
  dialog.appendChild(bodyWrap);
  overlay.appendChild(dialog);
  document.body.appendChild(overlay);

  const destroy = () => overlay.remove();
  dialog.querySelector('.modal__close').addEventListener('click', destroy);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) destroy(); });

  // Локальный выбор в попапе, применяется по «Сохранить».
  let localIds = [...state.selectedUserIds];

  // Список сотрудников подгружаем из портала Битрикс24 (user.get) прямо при
  // открытии попапа, а не только при старте приложения. Так выбор остаётся
  // доступным, даже если первичная загрузка не прошла.
  async function renderBody() {
    bodyWrap.innerHTML =
      `<div class="form__meta">Сотрудники по умолчанию (до ${GRID.maxEmployees}). ` +
      'Список загружается из портала Битрикс24 и сохраняется в настройках приложения.</div>';

    if (state.allUsers.length === 0) {
      const loading = document.createElement('div');
      loading.className = 'form__loading';
      loading.textContent = 'Загрузка сотрудников портала…';
      bodyWrap.appendChild(loading);
      try {
        // Сначала дожидаемся готовности BX24 (иначе колбэк user.get может не
        // сработать), затем тянем список — всё под общим таймаутом.
        state.allUsers = await withTimeout((async () => {
          await init();
          return loadUsers();
        })(), 20000);
        emit(); // обновить подпись мультиселекта в шапке
      } catch (e) {
        renderError(e);
        return;
      }
    }

    if (state.allUsers.length === 0) {
      renderError(new Error('Портал не вернул ни одного активного сотрудника.'));
      return;
    }

    bodyWrap.querySelector('.form__loading')?.remove();
    const panel = buildCheckboxPanel({
      getSelected: () => new Set(localIds),
      onChange: (ids) => { localIds = ids; },
      embedded: true,
    });
    bodyWrap.appendChild(panel);
    bodyWrap.appendChild(buildFooter());
  }

  function renderError(e) {
    bodyWrap.querySelector('.form__loading')?.remove();
    const box = document.createElement('div');
    box.className = 'form__loading';
    box.textContent = 'Не удалось загрузить список сотрудников: ' +
      (e && e.message ? e.message : String(e));
    const retry = document.createElement('button');
    retry.className = 'btn btn--primary';
    retry.style.marginTop = '12px';
    retry.textContent = 'Повторить';
    retry.addEventListener('click', renderBody);
    box.appendChild(document.createElement('br'));
    box.appendChild(retry);
    bodyWrap.appendChild(box);
  }

  function buildFooter() {
    const footer = document.createElement('div');
    footer.className = 'modal__footer';
    footer.innerHTML =
      '<button class="btn btn--ghost" data-act="cancel">Отмена</button>' +
      '<button class="btn btn--primary" data-act="save">Сохранить</button>';
    footer.querySelector('[data-act=cancel]').addEventListener('click', destroy);
    footer.querySelector('[data-act=save]').addEventListener('click', async () => {
      await applySelection(localIds);
      showToast('Настройки сохранены', 'success');
      destroy();
    });
    return footer;
  }

  renderBody();
}

// --- Переиспользуемая панель с чекбоксами ----------------------------------

function buildCheckboxPanel({ getSelected, onChange, embedded }) {
  const panel = document.createElement('div');
  panel.className = 'emp-panel' + (embedded ? ' emp-panel--embedded' : '');

  const search = document.createElement('input');
  search.className = 'emp-panel__search';
  search.type = 'text';
  search.placeholder = 'Поиск сотрудника…';
  panel.appendChild(search);

  const counter = document.createElement('div');
  counter.className = 'emp-panel__counter';
  panel.appendChild(counter);

  const list = document.createElement('div');
  list.className = 'emp-panel__list';
  panel.appendChild(list);

  function currentSelected() { return new Set(getSelected()); }

  function render() {
    const selected = currentSelected();
    counter.textContent = `Выбрано ${selected.size} из ${GRID.maxEmployees}`;
    const q = search.value.trim().toLowerCase();
    list.innerHTML = '';
    const users = state.allUsers.filter((u) =>
      !q || u.name.toLowerCase().includes(q) || (u.position || '').toLowerCase().includes(q));
    if (users.length === 0) {
      list.innerHTML = '<div class="emp-panel__empty">Ничего не найдено</div>';
      return;
    }
    for (const u of users) {
      const isOn = selected.has(u.id);
      const atLimit = selected.size >= GRID.maxEmployees && !isOn;
      const row = document.createElement('label');
      row.className = 'emp-row' + (atLimit ? ' emp-row--disabled' : '');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = isOn;
      cb.disabled = atLimit;
      cb.addEventListener('change', () => {
        const set = currentSelected();
        if (cb.checked) {
          if (set.size >= GRID.maxEmployees) { cb.checked = false; return; }
          set.add(u.id);
        } else {
          set.delete(u.id);
        }
        onChange([...set]);
        render();
      });
      const info = document.createElement('div');
      info.className = 'emp-row__info';
      info.innerHTML = `<div class="emp-row__name">${escapeHtml(u.name)}</div>` +
        (u.position ? `<div class="emp-row__pos">${escapeHtml(u.position)}</div>` : '');
      row.appendChild(cb);
      row.appendChild(info);
      list.appendChild(row);
    }
  }

  search.addEventListener('input', render);
  panel.refresh = render;
  render();
  return panel;
}

// Ограничиваем ожидание ответа портала: если BX24 SDK не инициализирован
// (например, приложение открыто вне портала Битрикс24), колбэк user.get может
// не сработать никогда — тогда показываем понятную ошибку вместо «вечной»
// загрузки.
function withTimeout(promise, ms) {
  let timer;
  const guard = new Promise((_, reject) => {
    timer = setTimeout(() => reject(new Error(
      'портал не ответил за ' + Math.round(ms / 1000) + ' с. ' +
      'Если приложение открыто внутри Битрикс24, скорее всего у него нет ' +
      'права «Пользователи (user)» — добавьте этот scope в настройках ' +
      'приложения и переустановите его. Затем повторите.')), ms);
  });
  return Promise.race([promise, guard]).finally(() => clearTimeout(timer));
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}


// ===== js/app.js =====
// Точка входа: инициализация Битрикс24, загрузка данных и связывание UI.


const $ = (sel) => document.querySelector(sel);

async function boot() {
  bindHeader();
  subscribe(renderAll);

  try {
    await init();
  } catch (e) {
    showError(e);
    $('#calendar').innerHTML =
      '<div class="cal-empty"><div class="cal-empty__icon">⚠</div>' +
      '<div class="cal-empty__text">Откройте приложение внутри портала Битрикс24.</div></div>';
    return;
  }

  await loadInitialData();
}

async function loadInitialData() {
  state.loading = true; emit();
  try {
    const [users, savedIds] = await Promise.all([loadUsers(), loadSelectedUserIds()]);
    state.allUsers = users;
    // Оставляем только реально существующих сотрудников.
    const valid = new Set(users.map((u) => u.id));
    setSelectedUserIds(savedIds.filter((id) => valid.has(id)));
    renderHeaderPicker($('#emp-picker'));
  } catch (e) {
    showError(e);
  } finally {
    state.loading = false; emit();
  }
  await reloadWeek();
}

async function reloadWeek() {
  if (state.selectedUserIds.length === 0) {
    state.dataByUser = new Map();
    emit();
    return;
  }
  state.loading = true; state.error = null; emit();
  try {
    state.dataByUser = await loadWeekData(state.selectedUserIds, state.currentWeek);
  } catch (e) {
    state.error = e;
    showError(e);
  } finally {
    state.loading = false; emit();
  }
}
bus.reloadWeek = reloadWeek;

// --- Шапка ----------------------------------------------------------------

function bindHeader() {
  $('#nav-prev').addEventListener('click', () => changeWeek(-1));
  $('#nav-next').addEventListener('click', () => changeWeek(1));
  $('#nav-today').addEventListener('click', () => {
    state.currentWeek = startOfWeek(new Date());
    reloadWeek();
  });
  $('#btn-settings').addEventListener('click', openSettings);
}

function changeWeek(delta) {
  state.currentWeek = addWeeks(state.currentWeek, delta);
  reloadWeek();
}

// --- Рендер по изменению состояния ----------------------------------------

function renderAll() {
  updateWeekLabel();
  updateLoading();
  renderCalendar($('#calendar'));
}

function updateWeekLabel() {
  const days = weekDays(state.currentWeek);
  const first = days[0];
  const last = days[days.length - 1];
  $('#week-label').textContent = `${formatDayLabel(first)} — ${formatDayLabel(last)}`;
}

function updateLoading() {
  document.body.classList.toggle('is-loading', !!state.loading);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

})();
</script>
